            # swap).
            (while sleep 300; do free -g | awk '/^Mem:/{m=$3} /^Swap:/{w=$3} END{print "memory in use " m " GB, swap in use " w " GB"}'; done) &
            sampler=$!
            trap 'pkill -P "$sampler" 2>/dev/null; kill "$sampler" 2>/dev/null || true' EXIT
          fi
          projects/shared-pool/kani/run.sh kani "${harnesses[@]}"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kani-logs-large-${{ strategy.job-index }}
          path: ${{ runner.temp }}/kani-logs
          retention-days: 14

  kani-record:
    # The local record of the kani-large groups and kani-mutants-large
    # mutants (kani/local; see above `plain:`), on every run:
    # tools/scripts/check-kani-record.py after its self-test. Seconds; no
    # submodule (the fingerprint reads git objects: the gitlink is the
    # core's commit). A stale record fails, unless this run verifies all
    # it records on KANI_RUNNER: kani-large its harnesses (the pin job's
    # `kani` and `large`), kani-mutants-large its mutants (`mutants` and
    # `large`). Then it is a warning.
    needs: pin
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Record check self-test
        run: tools/scripts/test-check-kani-record.sh
      - name: The local record is this commit's, ok, and splits the harnesses and mutants with the groups
        env:
          # Whether kani-large and kani-mutants-large run (their `if:`).
          LARGE_HARNESSES: ${{ needs.pin.outputs.kani == 'true' && needs.pin.outputs.large == 'true' }}
          LARGE_MUTANTS: ${{ inputs.mutants == true && needs.pin.outputs.large == 'true' }}
        run: |
          args=()
          if [ "$LARGE_HARNESSES" = true ]; then args+=(--stale-ok-harnesses); fi
          if [ "$LARGE_MUTANTS" = true ]; then args+=(--stale-ok-mutants); fi
          tools/scripts/check-kani-record.py ${args[@]+"${args[@]}"}

  covers:
    # Every harness of kani/run.sh in exactly one kani or kani-large group,
    # or (without KANI_RUNNER) the local record, and every cover SATISFIED
    # in at least one harness of its family across them (each group
    # uploads its logs and covers.tsv; the record holds its harnesses'
    # covers): 89 harnesses and 164 covers at kani/RESULTS.md.
    needs: [pin, kani, kani-large, kani-record]
    if: ${{ !cancelled() && needs.kani.result != 'skipped' }}
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      # Whether kani-large ran (its `if:`): then its logs hold the large
      # groups' harnesses and covers, else the local record does.
      LARGE: ${{ needs.pin.outputs.kani == 'true' && needs.pin.outputs.large == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: kani-logs-*
          path: ${{ runner.temp }}/kani-logs
      - name: Every harness in one group or the local record
        run: |
          mkdir -p "$RUNNER_TEMP/kani-logs"
          want=$(projects/shared-pool/kani/run.sh list | sort)
          ran=$(cd "$RUNNER_TEMP/kani-logs" && find . -mindepth 2 -maxdepth 2 -name 'h_*.log' | sed 's|.*/||; s|\.log$||')
          if [ "$LARGE" != true ]; then
            # Without KANI_RUNNER the large groups' harnesses are the local
            # record's (kani-record checks the record).
            rec=$(tools/scripts/check-kani-record.py harnesses) || exit 1
            ran=$(printf '%s\n%s\n' "$ran" "$rec")
          fi
          ran=$(echo "$ran" | sed '/^$/d' | sort)
          missing=$(comm -23 <(echo "$want") <(echo "$ran" | sort -u))
          extra=$(comm -13 <(echo "$want") <(echo "$ran" | sort -u))
          twice=$(echo "$ran" | uniq -d)
          if [ -n "$missing$extra$twice" ]; then
            echo "::error::the kani groups and the local record must run every harness of kani/run.sh once"
            [ -z "$missing" ] || echo "in no group or the record (or its job failed before it): $missing"
            [ -z "$extra" ] || echo "not a harness of run.sh: $extra"
            [ -z "$twice" ] || echo "in more than one group or the record: $twice"
            exit 1
          fi
          echo "$(echo "$ran" | wc -l | tr -d ' ') harnesses, each in one group$([ "$LARGE" = true ] || echo ' or the local record')"
      - name: Covers per family
        run: |
          files=("$RUNNER_TEMP"/kani-logs/*/covers.tsv)
          if [ "$LARGE" != true ]; then
            # The local record's harnesses' covers, in run.sh's format.
            tools/scripts/check-kani-record.py covers >"$RUNNER_TEMP/local-record-covers.tsv"
            files+=("$RUNNER_TEMP/local-record-covers.tsv")
          fi
          tools/scripts/check-covers.sh "${files[@]}"

  kani-mutants:
    # Each mutant of kani/mutants in plain mode and under Kani (kani/run.sh
    # mutants --kani <NN>-*): a must-kill mutant must make plain mode fail
    # and its `killed-by` harness FAIL (CBMC stops at the first violated
    # check); the equivalent mutant 20 must pass plain mode and both its
    # `checked-by` harnesses. Manual runs with `mutants` only, as
    # near-approval's mutants job. Here the 15 whose harness peaked at
    # 13 GB or less; the other 16 are kani-mutants-large's on KANI_RUNNER,
    # or the local record's (see above `plain:`). Runner and swap as in the
    # kani job.
    needs: pin
    if: inputs.mutants
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.KANI_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    # The hosted-runner cap: a plain run, codegen and at most two harnesses
    # of KANI_TIMEOUT.
    timeout-minutes: 360
    env:
      KANI_SWAP_GB: ${{ vars.KANI_SWAP_GB || '16' }}
      GB: ${{ matrix.gb }}
    strategy:
      fail-fast: false
      matrix:
        # gb: the peak of the mutant's killed-by (or checked-by) harness in
        # kani/RESULTS.md, the larger for mutants 05 and 20, which name two,
        # at most 13 here; timeout: KANI_TIMEOUT, three times that harness's
        # time, at least 1800 s. These, and kani-mutants-large's or the
        # local record's, are every mutants/*.patch once
        # (check-kani-record.py).
        include:
          - { mutant: "02", gb: 5, timeout: 1800 }
          - { mutant: "04", gb: 5, timeout: 1800 }
          - { mutant: "07", gb: 9, timeout: 1800 }
          - { mutant: "08", gb: 5, timeout: 1800 }
          - { mutant: "09", gb: 3, timeout: 1800 }
          - { mutant: "13", gb: 9, timeout: 1800 }
          - { mutant: "14", gb: 12, timeout: 1800 }
          - { mutant: "17", gb: 9, timeout: 1800 }
          - { mutant: "20", gb: 12, timeout: 1800 }
          - { mutant: "22", gb: 3, timeout: 1800 }
          - { mutant: "24", gb: 4, timeout: 1800 }
          - { mutant: "26", gb: 3, timeout: 1800 }
          - { mutant: "27", gb: 9, timeout: 1800 }
          - { mutant: "29", gb: 12, timeout: 1800 }
          - { mutant: "31", gb: 10, timeout: 1800 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Toolchain from versions.env
        run: |
          . tools/versions.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          # For this job only: `rustup default` would outlive it on a
          # self-hosted runner.
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install Kani (and the CBMC it bundles)
        run: |
          . tools/versions.env
          cargo install --locked kani-verifier --version "$KANI"
          # `cargo kani setup` always re-downloads the bundle; on a persistent
          # self-hosted HOME skip it once the bundle and its toolchain link
          # (setup's last step) are in place.
          kani_dir="${KANI_HOME:-$HOME/.kani}/kani-$KANI"
          if [ ! -x "$kani_dir/bin/cbmc" ] || [ ! -d "$kani_dir/toolchain/bin" ]; then
            cargo kani setup
          fi
      - name: Check CBMC version
        run: |
          . tools/versions.env
          # The pinned version's own CBMC: a persistent HOME may hold others.
          cbmc_bin="${KANI_HOME:-$HOME/.kani}/kani-$KANI/bin/cbmc"
          "$cbmc_bin" --version | grep -q "^$CBMC" || { echo "CBMC is not $CBMC"; "$cbmc_bin" --version; exit 1; }
      - name: Swap, a margin over the measured peak
        # Hosted Linux only: it deletes SDKs and replaces the host's swap
        # with sudo, which a self-hosted runner must not do (and macOS sizes
        # its own swap). This job's entries peaked at 13 GB or less on
        # macOS and run in memory on ubuntu-latest; the swap file
        # (KANI_SWAP_GB, default 16; 0: none) is a margin for a Linux peak
        # above the macOS one, which leaves out compressed pages. The large
        # entries do not run on hosted swap (see above `plain:`).
        if: env.KANI_SWAP_GB != '0' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          # Free preinstalled SDKs this job does not use, for the swap file;
          # leave 6 GB of disk for the build and logs.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          gb=$(( KANI_SWAP_GB < avail - 6 ? KANI_SWAP_GB : avail - 6 ))
          if [ "$gb" -lt 1 ]; then echo "::warning::no disk for swap (${avail} GB free)"; exit 0; fi
          sudo swapoff -a || true
          sudo fallocate -l "${gb}G" /kani.swap
          sudo chmod 600 /kani.swap
          sudo mkswap /kani.swap >/dev/null
          sudo swapon /kani.swap
          echo "::notice::swap ${gb} GB, disk free $(df --output=avail -BG / | tail -1)"
      - name: Runner size against the measured peak
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ram=$(( $(sysctl -n hw.memsize) / 1073741824 )); swap=
          else
            ram=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1048576 ))
            swap=$(( $(awk '/^SwapTotal:/{print $2}' /proc/meminfo) / 1048576 ))
          fi
          echo "::notice::runner has $(getconf _NPROCESSORS_ONLN) CPUs, $ram GB memory, ${swap:-dynamic} GB swap; this job's harnesses peaked at $GB GB (kani/RESULTS.md)"
          if [ "$ram" -lt "$GB" ]; then
            if [ -n "$swap" ] && [ $(( ram + swap )) -lt "$GB" ]; then
              echo "::error::this job's harnesses peaked at $GB GB and the runner has $ram GB of memory and $swap GB of swap: set KANI_RUNNER to a runner with at least $(( (GB * 5 + 3) / 4 )) GB (strategy.md section 14)"
              exit 1
            fi
            echo "::warning::this job's harnesses peaked at $GB GB, above the runner's $ram GB: they run on swap, up to 4 times slower than measured or out of time (CI run 43469880167); KANI_RUNNER names a larger runner (strategy.md section 14)"
          fi
      - name: Mutant ${{ matrix.mutant }} (plain mode and Kani)
        env:
          KANI_TIMEOUT: ${{ matrix.timeout }}
          KEEP_LOGS: ${{ runner.temp }}/kani-mutant-logs
          MUTANT: ${{ matrix.mutant }}
        run: |
          # As in the kani job (on swap: a share of 300 minutes for each of
          # at most two harnesses, after the plain run).
          export KANI_MAX_GB=$(( (GB * 3 + 1) / 2 ))
          v=$(sed -n 's/^KANI=//p' tools/versions.env)
          export KANI_CBMC="${KANI_HOME:-$HOME/.kani}/kani-$v/bin/cbmc"
          if [ -r /proc/meminfo ] && [ $(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1048576 )) -lt "$GB" ] && [ $(( 300 * 60 / 2 )) -gt "$KANI_TIMEOUT" ]; then
            export KANI_TIMEOUT=$(( 300 * 60 / 2 ))
            echo "::notice::on swap: KANI_TIMEOUT $KANI_TIMEOUT s per harness"
          fi
          mkdir -p "$KEEP_LOGS"
          projects/shared-pool/kani/run.sh mutants --kani "$MUTANT-*"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kani-mutant-logs-${{ matrix.mutant }}
          path: ${{ runner.temp }}/kani-mutant-logs
          retention-days: 14

  kani-mutants-large:
    # The 16 mutants whose killed-by (or checked-by) harness peaked above
    # 13 GB, run as kani-mutants runs its own, on KANI_RUNNER only (the pin
    # job's `large`; see kani-large); without it kani-record checks their
    # local record. Manual runs with `mutants` only. No swap step, and a
    # hosted runner must hold them in memory (the runner-size step).
    needs: pin
    if: inputs.mutants && needs.pin.outputs.large == 'true'
