    timeout-minutes: 360
    env:
      GB: ${{ matrix.gb }}
    strategy:
      fail-fast: false
      matrix:
        # As in kani-mutants. Mutant 21 takes h_full_256 past the record
        # limit into the scans of 256 records (RESULTS.md: 262 s, 33.8M
        # clauses); its peak was not recorded, so it gets h_full_255's.
        # These are the local record's mutants (check-kani-record.py), and
        # kani/local/run-local.py runs them from this list.
        include:
          - { mutant: "01", gb: 21, timeout: 1800 }
          - { mutant: "03", gb: 21, timeout: 1800 }
          - { mutant: "05", gb: 14, timeout: 1800 }
          - { mutant: "06", gb: 21, timeout: 1800 }
          - { mutant: "10", gb: 14, timeout: 1800 }
          - { mutant: "11", gb: 21, timeout: 1800 }
          - { mutant: "12", gb: 21, timeout: 1800 }
          - { mutant: "15", gb: 21, timeout: 1800 }
          - { mutant: "16", gb: 14, timeout: 1800 }
          - { mutant: "18", gb: 24, timeout: 4800 }
          - { mutant: "19", gb: 21, timeout: 1800 }
          - { mutant: "21", gb: 20, timeout: 1800 }
          - { mutant: "23", gb: 21, timeout: 1800 }
          - { mutant: "25", gb: 19, timeout: 5100 }
          - { mutant: "28", gb: 21, timeout: 1800 }
          - { mutant: "30", gb: 20, timeout: 2400 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Toolchain from versions.env
        run: |
          . tools/versions.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          # For this job only: `rustup default` would outlive it on a
          # self-hosted runner.
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install Kani (and the CBMC it bundles)
        run: |
          . tools/versions.env
          cargo install --locked kani-verifier --version "$KANI"
          # `cargo kani setup` always re-downloads the bundle; on a persistent
          # self-hosted HOME skip it once the bundle and its toolchain link
          # (setup's last step) are in place.
          kani_dir="${KANI_HOME:-$HOME/.kani}/kani-$KANI"
          if [ ! -x "$kani_dir/bin/cbmc" ] || [ ! -d "$kani_dir/toolchain/bin" ]; then
            cargo kani setup
          fi
      - name: Check CBMC version
        run: |
          . tools/versions.env
          # The pinned version's own CBMC: a persistent HOME may hold others.
          cbmc_bin="${KANI_HOME:-$HOME/.kani}/kani-$KANI/bin/cbmc"
          "$cbmc_bin" --version | grep -q "^$CBMC" || { echo "CBMC is not $CBMC"; "$cbmc_bin" --version; exit 1; }
      - name: Runner size against the measured peak
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ram=$(( $(sysctl -n hw.memsize) / 1073741824 )); swap=
          else
            ram=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1048576 ))
            swap=$(( $(awk '/^SwapTotal:/{print $2}' /proc/meminfo) / 1048576 ))
          fi
          echo "::notice::runner has $(getconf _NPROCESSORS_ONLN) CPUs, $ram GB memory, ${swap:-dynamic} GB swap; this job's harnesses peaked at $GB GB (kani/RESULTS.md)"
          if [ "$ram" -lt "$GB" ]; then
            # The large entries do not run on a hosted runner's swap: there
            # they failed or crawled (CI runs 43469880167, 43488691444).
            if [ "$RUNNER_KIND" = github-hosted ]; then
              echo "::error::this job's harnesses peaked at $GB GB and this hosted runner has $ram GB of memory: set KANI_RUNNER to a runner with at least $(( (GB * 5 + 3) / 4 )) GB, or unset it so that kani-record checks the local record (strategy.md section 14)"
              exit 1
            fi
            if [ -n "$swap" ] && [ $(( ram + swap )) -lt "$GB" ]; then
              echo "::error::this job's harnesses peaked at $GB GB and the runner has $ram GB of memory and $swap GB of swap: set KANI_RUNNER to a runner with at least $(( (GB * 5 + 3) / 4 )) GB (strategy.md section 14)"
              exit 1
            fi
            echo "::warning::this job's harnesses peaked at $GB GB, above the runner's $ram GB: they run on swap, up to 4 times slower than measured or out of time (CI run 43469880167); KANI_RUNNER names a larger runner (strategy.md section 14)"
          fi
      - name: Mutant ${{ matrix.mutant }} (plain mode and Kani)
        env:
          KANI_TIMEOUT: ${{ matrix.timeout }}
          KEEP_LOGS: ${{ runner.temp }}/kani-mutant-logs
          MUTANT: ${{ matrix.mutant }}
        run: |
          # As in the kani job (on swap: a share of 300 minutes for each of
          # at most two harnesses, after the plain run).
          export KANI_MAX_GB=$(( (GB * 3 + 1) / 2 ))
          v=$(sed -n 's/^KANI=//p' tools/versions.env)
          export KANI_CBMC="${KANI_HOME:-$HOME/.kani}/kani-$v/bin/cbmc"
          if [ -r /proc/meminfo ] && [ $(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1048576 )) -lt "$GB" ] && [ $(( 300 * 60 / 2 )) -gt "$KANI_TIMEOUT" ]; then
            export KANI_TIMEOUT=$(( 300 * 60 / 2 ))
            echo "::notice::on swap: KANI_TIMEOUT $KANI_TIMEOUT s per harness"
          fi
          mkdir -p "$KEEP_LOGS"
          projects/shared-pool/kani/run.sh mutants --kani "$MUTANT-*"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kani-mutant-logs-${{ matrix.mutant }}
          path: ${{ runner.temp }}/kani-mutant-logs
          retention-days: 14

  tla:
    # TLA-SAFE and the TLA-WIT witnesses (MC_Safety), LIVE-2 on the completion
    # path and its required failures (TLA-LIVE-1, TLA-LIVE-F1, TLA-LIVE-F2),
    # REF-5 (TraceCheck replays every conformance trace), then the 31 spec
    # mutants. TLA-IND (Apalache) is not implemented; run.sh would print skip.
    # On a 10-core Mac: 573 s for safety liveness trace, 150 s for mutants.
    needs: pin
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # Hosted runners only; a self-hosted runner keeps the TLA+ tools in
        # its tool cache (TLA_CACHE below).
        if: runner.environment == 'github-hosted'
        with:
          path: tools/.cache
          key: sp-tla-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env') }}
      - name: TLC safety, liveness and trace replay
        env:
          TLA_HEAP: ${{ runner.environment == 'github-hosted' && '5g' || '12g' }}
          TLA_LOG_DIR: ${{ runner.temp }}/tla-logs
          TLA_CACHE: ${{ runner.environment != 'github-hosted' && format('{0}/formalver-tla', runner.tool_cache) || '' }}
        run: projects/shared-pool/tla/run.sh safety liveness trace
      - name: Spec mutants
        env:
          TLA_HEAP: ${{ runner.environment == 'github-hosted' && '5g' || '12g' }}
          TLA_LOG_DIR: ${{ runner.temp }}/tla-logs
          TLA_CACHE: ${{ runner.environment != 'github-hosted' && format('{0}/formalver-tla', runner.tool_cache) || '' }}
        run: projects/shared-pool/tla/run.sh mutants
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tla-logs
          path: ${{ runner.temp }}/tla-logs
          retention-days: 14

  lean:
    # LEAN-IND, LEAN-STEP, LEAN-LIVE1 and LEAN-GUARD for states of every size,
    # LEAN-WIT (F-1 proved permanent), the axiom audit, the canaries, REF-5L
    # (every conformance trace on the Lean machine) and the 16 mutants.
    # 227 s on a 10-core Mac, most of it the mutants.
    needs: pin
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # Hosted runners only; a self-hosted runner keeps Lean in its tool
        # cache (LEAN_CACHE below).
        if: runner.environment == 'github-hosted'
        with:
          path: tools/.cache
          key: sp-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env') }}
      - name: Lean toolchain from versions.env
        env:
          LEAN_CACHE: ${{ runner.environment != 'github-hosted' && format('{0}/formalver-lean', runner.tool_cache) || '' }}
        run: tools/scripts/get-lean.sh >> "$GITHUB_PATH"
      - name: Build, hygiene, audit, canaries, REF-5L, mutants
        env:
          LEAN_LOG_DIR: ${{ runner.temp }}/lean-logs
        run: projects/shared-pool/lean/run.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-logs
          path: ${{ runner.temp }}/lean-logs
          retention-days: 14

  prolog:
    # Requirement checks C-1..C-6, MC-1 (three small universes), MC-2 (every
    # conformance trace through step/4), COV-2 (test_reads: the core's
    # preview and best_quantity in traces/reads.txt against the model), the
    # canaries, the PROP tags and the 33 mutants (the 2 reads mutants patch
    # the core and rebuild the conformance generator with cargo).
    # extract.py reads the pinned sources, so this job needs the submodule.
    # C-6 compares the catalogue in traceability.pl with section 5 of
    # projects/shared-pool/strategy.md (the path filters include that file
    # again); a missing file or section fails it. 511 s on a 10-core Mac.
    needs: pin
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scryer install root
        # The runner context is not available in job-level env.
        run: echo "SCRYER_ROOT=$RUNNER_TOOL_CACHE/formalver-scryer" >> "$GITHUB_ENV"
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Toolchain from versions.env
        run: |
          . tools/versions.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          # For this job only: `rustup default` would outlive it on a
          # self-hosted runner.
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: runner.environment == 'github-hosted'
        with:
          path: ${{ env.SCRYER_ROOT }}
          key: scryer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env') }}
      - name: Scryer Prolog from versions.env
        # Installed under the tool cache, not the shared CARGO_HOME, so a
        # self-hosted runner keeps one copy per version for this repository.
        run: |
          . tools/versions.env
          root="$SCRYER_ROOT/$SCRYER"
          if ! "$root/bin/scryer-prolog" --version 2>/dev/null | grep -q "$SCRYER"; then
            cargo install --locked scryer-prolog --version "$SCRYER" --root "$root"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Extraction, suites, canaries, PROP tags, mutants (run.sh)
        env:
          PROLOG_LOGS: ${{ runner.temp }}/prolog-logs
        run: projects/shared-pool/prolog/run.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prolog-logs
          path: ${{ runner.temp }}/prolog-logs
          retention-days: 14

  near-unit:
    # The near-sdk shell on near-sdk's mocked runtime (near-tests/run.sh all):
    # 29 tests on the host path and on two wasm builds run by wasmi (plain
    # cargo, exactly upstream scripts/build.sh, and --cfg near), every
    # conformance trace through the shell included; the wasm surface (SURF-1;
    # SURF-2 is the known finding NT-F3, reported expected-fail); the 21 shell
    # mutants. Both wasm builds are plain cargo builds: no cargo-near.
    # On a 10-core Mac: about 1 min of tests and 9 min of mutants, warm.
    needs: pin
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Upstream toolchain, with the wasm target
        # The channel of source-mirror/rust-toolchain.toml (near-tests' own
        # file names the same), with that file's components, so rustup has
        # nothing left to fetch when cargo runs inside the mirror.
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' projects/shared-pool/source-mirror/rust-toolchain.toml)
          rustup toolchain install "$ch" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            projects/shared-pool/near-tests/target
          key: sp-near-unit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('projects/shared-pool/near-tests/rust-toolchain.toml', 'projects/shared-pool/near-tests/Cargo.lock') }}
      - name: Shell tests, wasm surface, shell mutants (run.sh all)
        env:
          KEEP_LOGS: ${{ runner.temp }}/near-tests-mutants
        run: |
          # run-mutants.sh copies each mutant's log into KEEP_LOGS but does
          # not create it.
          mkdir -p "$KEEP_LOGS"
          projects/shared-pool/near-tests/run.sh all
      - name: Upload mutant logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: near-tests-mutants
          path: ${{ runner.temp }}/near-tests-mutants
          retention-days: 14

  sandbox:
    # The real wasm on a local near-sandbox 2.13.4 (sandbox/run.sh): the
    # lockfile rule, both wasm variants (upstream and cfg-near), RT-PRED,
    # RT-PRIVATE, RT-CALLBACK, RT-REVERT, RT-RACE, RT-WEDGE (F-1), the SB-1
    # witness, and RES-1 at the 256-record state. Manual dispatch only, with
    # the `sandbox` input. 438 s warm on a 10-core Mac before the second
    # RES-1 test, which adds about 9 minutes (sandbox/RESULTS.md, Run
    # times); a cold build of near-workspaces and the wasm adds more.
    needs: pin
    if: github.event_name == 'workflow_dispatch' && inputs.sandbox
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Python >= 3.11 (tomllib)
        if: runner.os == 'macOS'
        run: |
          python3 -c 'import tomllib' 2>/dev/null && exit 0
          for py in python3.13 python3.12 python3.11; do
            if p=$(command -v "$py"); then
              mkdir -p "$RUNNER_TEMP/python-bin"
              ln -sf "$p" "$RUNNER_TEMP/python-bin/python3"
              echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::no python3 >= 3.11 on PATH"; exit 1
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Upstream toolchain, with the wasm target
        # As in near-unit; the sandbox scripts call `cargo +<channel>`.
        run: |
          ch=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' projects/shared-pool/source-mirror/rust-toolchain.toml)
          rustup toolchain install "$ch" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # Hosted runners only. The near-sandbox binary (sha256-checked by
        # scripts/sandbox-bin.sh) is cached with the crates.
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/formalver/near-sandbox
            projects/shared-pool/sandbox/target
          key: sp-sandbox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('projects/shared-pool/sandbox/rust-toolchain.toml', 'projects/shared-pool/sandbox/Cargo.lock') }}
      - name: Lockfile, wasm builds, runtime tests, RES-1 (run.sh)
        env:
          # One sandbox at a time on a 2-CPU hosted runner: RT-RACE times
          # its calls (0 to 400 ms), and parallel sandboxes would shift them.
          SANDBOX_TEST_THREADS: ${{ runner.environment == 'github-hosted' && '1' || '3' }}
        run: projects/shared-pool/sandbox/run.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-results
          path: projects/shared-pool/sandbox/results/
          retention-days: 14
