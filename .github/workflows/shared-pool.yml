          - { group: "h_bmc_from_init_s_dispatch h_bmc_from_init_s_ack h_bmc_from_init_s_pause h_bmc_from_init_s_observe", gb: 19, timeout: 1800 }
          - { group: "h_bmc_from_init_s_cancel h_bmc_from_init_s_settle", gb: 18, timeout: 1800 }
          - { group: "h_bmc_from_init_s_submit", gb: 30, timeout: 3600 }
          - { group: "h_bmc_from_init_po", gb: 27, timeout: 4800 }
          - { group: "h_version_max_submit h_energy", gb: 19, timeout: 1800 }
          - { group: "h_energy_exact", gb: 19, timeout: 5100 }
          - { group: "h_energy_max", gb: 33, timeout: 1800 }
          - { group: "h_wedge", gb: 39, timeout: 1800 }
          - { group: "h_slot_cycle_0 h_full_255", gb: 20, timeout: 2400 }
          - { group: "h_slot_cycle_2", gb: 25, timeout: 2700 }
          - { group: "h_init h_validate", gb: 27, timeout: 2400 }
          - { group: "h_preview", gb: 24, timeout: 4800 }
          - { group: "h_preview_post", gb: 22, timeout: 4500 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
