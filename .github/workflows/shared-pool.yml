# shared-pool CI: the layers of projects/shared-pool against the pinned
# shared-pool-controls commit (status.toml pinned_commit, a4bb5c3: PR #1's
# head, on upstream main since PR #1 merged). Verified: shared-pool-controls
# v1.0.0 (contract code byte-identical to the pin a4bb5c3); the pin job
# fails if that identity stops holding (status.toml verified_release_commit
# and identical_paths). Upstream PR #4 (v1.1) is not verified here.
# Each layer has its own runner, projects/shared-pool/<layer>/run.sh (exit 0 =
# every check passes, vacuity guards included); the jobs below call them.
# The Kani jobs (plain, mutants, kani, kani-large, kani-record, covers,
# kani-mutants, kani-mutants-large) and their runners are described after
# the conformance job.
# shared-pool-controls is public; the jobs that read the source fetch its
# submodule without a key. TLA+ and Lean read only the checked-in traces.
# The pin and v1.0.0 are fetched by SHA; both are on upstream main.
name: shared-pool

on:
  pull_request:
    paths:
      - "projects/shared-pool/**"
      - ".github/workflows/shared-pool.yml"
      - "tools/scripts/check-covers.sh"
      - "tools/scripts/check-kani-record.py"
      - "tools/scripts/test-check-kani-record.sh"
      - "tools/scripts/check-pin.sh"
      - "tools/scripts/check-status.sh"
      - "tools/scripts/ci-submodule.sh"
      - "tools/scripts/get-lean.sh"
      - "tools/scripts/get-tla-tools.sh"
      - "tools/versions.env"
      - ".gitmodules"
      - "!**/*.md"
      - "!**/*.mdx"
      - "!**/*.rst"
      - "!**/*.adoc"
      - "!**/docs/**"
      # Re-included (a later positive pattern wins): the prolog job's C-6
      # reads section 5 of this file. A change to it alone runs every job.
      - "projects/shared-pool/strategy.md"
  push:
    branches: [main]
    paths:
      - "projects/shared-pool/**"
      - ".github/workflows/shared-pool.yml"
      - "tools/scripts/check-covers.sh"
      - "tools/scripts/check-kani-record.py"
      - "tools/scripts/test-check-kani-record.sh"
      - "tools/scripts/check-pin.sh"
      - "tools/scripts/check-status.sh"
      - "tools/scripts/ci-submodule.sh"
      - "tools/scripts/get-lean.sh"
      - "tools/scripts/get-tla-tools.sh"
      - "tools/versions.env"
      - ".gitmodules"
      - "!**/*.md"
      - "!**/*.mdx"
      - "!**/*.rst"
      - "!**/*.adoc"
      - "!**/docs/**"
      # Re-included (a later positive pattern wins): the prolog job's C-6
      # reads section 5 of this file. A change to it alone runs every job.
      - "projects/shared-pool/strategy.md"
  workflow_dispatch:
    inputs:
      sandbox:
        description: "Also run the sandbox job (real wasm on near-sandbox: RT-*, RES-1)"
        type: boolean
        default: false
      kani:
        description: "Run the kani matrix (8 in-memory groups; the 21 large groups only on KANI_RUNNER, otherwise their local record is checked)"
        type: boolean
        default: true
      mutants:
        description: "Also run the kani-mutants job (15 mutants under Kani; the 16 large ones only on KANI_RUNNER, otherwise from the local record)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shared-pool-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Runner labels work as in near-approval.yml: each job takes CI_RUNNER and
# falls back to ubuntu-latest; the jobs that run CBMC (kani, kani-large,
# kani-mutants, kani-mutants-large) take KANI_RUNNER ahead of CI_RUNNER,
# as near-approval's kani job does. The clause that opens each runs-on
# sends Dependabot and automated-agent runs to ubuntu-latest. Keep every
# copy byte-identical with near-approval.yml's.
# A self-hosted runner keeps HOME between jobs and has no sudo: no step runs
# `rustup default`, caches are for hosted runners only, and the swap step
# runs on hosted Linux only.
#
# Two toolchains. Crates of this repository (conformance, the Scryer install)
# use RUST_TOOLCHAIN from tools/versions.env. The shell layers
# (near-tests, sandbox) build the upstream contracts with the upstream
# toolchain that source-mirror/rust-toolchain.toml names; those jobs must not
# set RUSTUP_TOOLCHAIN, or it would override the toolchain files.
jobs:
  pin:
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      kani: ${{ steps.kani.outputs.kani }}
      large: ${{ steps.kani.outputs.large }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The PR merge commit and its first parent (the base tip), for the
          # changed paths.
          fetch-depth: 2
      - name: Does this change reach the Kani layer? Where do the large groups run?
        id: kani
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          KANI_INPUT: ${{ inputs.kani }}
          KANI_RUNNER: ${{ vars.KANI_RUNNER }}
          # The kani job's runner: its runs-on, byte for byte.
          KANI_JOB_RUNNER: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.KANI_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
        run: |
          # The kani matrix takes hours, so it runs only when a path its
          # results depend on changed: the Kani crate (not its Markdown, not
          # the local runner and recorder kani/local/*.py; the local record's
          # data, which the covers job merges with the groups' covers), the
          # pinned core (the gitlink, .gitmodules), the conformance traces
          # (a mutant's plain mode replays them), the tool versions, the
          # scripts the Kani jobs call, or this workflow: every input of the
          # local record's fingerprint among them. plain, mutants and
          # kani-record (minutes) run on every change. A manual run follows
          # the `kani` input; a base commit that cannot be read runs the
          # matrix.
          re='^(projects/shared-pool/kani/|projects/shared-pool/source-mirror$|projects/shared-pool/conformance/traces/core\.txt$|\.gitmodules$|tools/versions\.env$|tools/scripts/(ci-submodule|check-covers)\.sh$|tools/scripts/check-kani-record\.py$|\.github/workflows/shared-pool\.yml$)'
          kani=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            kani=${KANI_INPUT:-true}
          elif [[ $BASE_SHA =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] &&
               { git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth 1 origin "$BASE_SHA"; }; then
            hits=$(git diff --no-renames --name-only "$BASE_SHA" HEAD | grep -E "$re" | grep -vE '\.(md|mdx|rst|adoc)$' | grep -vE '^projects/shared-pool/kani/local/[^/]*\.py$' || true)
            [ -n "$hits" ] || kani=false
            { echo "### Kani paths changed since $BASE_SHA"
              while IFS= read -r f; do echo "- $f"; done <<<"${hits:-none}"; } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::no readable base commit: running the kani matrix"
          fi
          echo "kani=$kani" | tee -a "$GITHUB_OUTPUT"
          # The large groups and mutants (peaks above 13 GB) run here only
          # on KANI_RUNNER (kani-large when kani is true, kani-mutants-large
          # with the `mutants` input): when it is set, is not ubuntu-latest
          # (on whose swap they failed or crawled), and this run is not
          # routed to ubuntu-latest. kani-record checks their local record
          # (kani/local) on every run, and excuses a stale one only for what
          # those jobs verify in the same run.
          large=false
          if [ -n "$KANI_RUNNER" ] && [ "$KANI_RUNNER" != ubuntu-latest ] && [ "$KANI_JOB_RUNNER" = "$KANI_RUNNER" ]; then large=true; fi
          echo "large=$large" | tee -a "$GITHUB_OUTPUT"
          echo "### Large Kani groups: $([ "$large" = true ] && [ "$kani" = true ] && echo "kani-large on KANI_RUNNER ($KANI_RUNNER)" || echo "from the local record (kani/local)")" >>"$GITHUB_STEP_SUMMARY"
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Python >= 3.11 (tomllib)
        if: runner.os == 'macOS'
        run: |
          # macOS's /usr/bin/python3 is 3.9; Homebrew's newer ones exist
          # under versioned names only.
          python3 -c 'import tomllib' 2>/dev/null && exit 0
          for py in python3.13 python3.12 python3.11; do
            if p=$(command -v "$py"); then
              mkdir -p "$RUNNER_TEMP/python-bin"
              ln -sf "$p" "$RUNNER_TEMP/python-bin/python3"
              echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::no python3 >= 3.11 on PATH"; exit 1
      - name: Gitlink, source hashes and v1.0.0 identity match status.toml
        # Also ASM-COMPILE: upstream [profile.release] keeps overflow-checks.
        # And the verified release: check-pin.sh fetches upstream 6f61616
        # (v1.0.0, status.toml verified_release_commit) by SHA and fails
        # unless crates/core/src/lib.rs, crates/contract and crates/executor
        # (identical_paths) are the same git trees and blobs as at the pin.
        run: tools/scripts/check-pin.sh shared-pool

  status-lint:
    # status.toml claims nothing the repository doesn't back (near-approval
    # strategy.md sections 12 and 14): 83 properties, 14 assumptions.
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Python >= 3.11 (tomllib)
        if: runner.os == 'macOS'
        run: |
          python3 -c 'import tomllib' 2>/dev/null && exit 0
          for py in python3.13 python3.12 python3.11; do
            if p=$(command -v "$py"); then
              mkdir -p "$RUNNER_TEMP/python-bin"
              ln -sf "$p" "$RUNNER_TEMP/python-bin/python3"
              echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::no python3 >= 3.11 on PATH"; exit 1
      - name: status-lint
        run: tools/scripts/check-status.sh shared-pool

  conformance:
    # The shared link between the layers: traces/core.txt (212 traces, 8,804
    # calls) must regenerate byte for byte from the pinned pool-core. TLA+,
    # Lean, Prolog and the shell replay this file, so a stale one would make
    # their replays evidence about other code. traces/reads.txt (COV-2: the
    # core's preview and best_quantity at 1,246 states, 36,797 requests,
    # compared with the Prolog model by prolog/tests/test_reads.pl) must
    # regenerate too; that run also fails if preview and submit disagree on
    # the real core or a read class is never reached. Seconds of work;
    # pool-core has no dependencies.
    needs: pin
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Toolchain from versions.env
        run: |
          . tools/versions.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          # For this job only: `rustup default` would outlive it on a
          # self-hosted runner.
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: traces/core.txt is current
        working-directory: projects/shared-pool/conformance
        run: cargo run --release --locked -- --check traces/core.txt
      - name: traces/reads.txt is current
        working-directory: projects/shared-pool/conformance
        run: cargo run --release --locked -- --reads-check traces/reads.txt

  # The Kani layer on the real pool-core (strategy.md section 6,
  # kani/RESULTS.md): plain, mutants and kani-record on every run; kani,
  # kani-large and covers when the change reaches the Kani layer (the pin
  # job's `kani` output, which a manual run sets with the `kani` input);
  # kani-mutants and kani-mutants-large on manual runs with `mutants`.
  #
  # Runners. kani/RESULTS.md measured each of the 89 harnesses one at a time
  # on a 10-core, 64 GB arm64 Mac: peaks from 0.6 to 39.0 GB (CBMC's
  # resident memory), 26,921 s in all. This repository is public, so
  # ubuntu-latest has 4 CPUs and 16 GB (15.6 GB usable; near-approval's kani
  # job reports it). The kani matrix groups the harnesses by measured peak:
  # - 53 harnesses in 8 groups peaked at 13 GB or less: the kani job. They
  #   fit that runner in memory, with about 2.6 GB to spare for the
  #   difference between the macOS measurement and Linux (and a swap file
  #   as a further margin).
  # - 36 harnesses in 21 groups peaked above 13 GB, 31 of them above 16 GB
  #   (h_wedge 39.0 GB): the kani-large job. On ubuntu-latest they ran on
  #   swap and failed or crawled (strategy.md section 14): in CI run
  #   43469880167 those on swap took up to 4.3 times their measured time,
  #   h_energy_max, h_validate and h_bmc_from_init_s_submit ran out of time
  #   and h_bmc_from_init_po's runner shut down; in run 43488691444
  #   h_bmc_from_init_s_submit's runner lost contact after 52 minutes on
  #   swap and h_bmc_from_init_po ran over 3 hours before it was cancelled.
  #   So they run on a local machine instead: kani/local/run-local.py runs
  #   kani-large's groups and kani-mutants-large's mutants with the same
  #   run.sh and KANI_TIMEOUT, two at a time on the 64 GB Mac, and
  #   kani/local/record.py writes the record to kani/local
  #   (kani/local/README.md): the run's commit, a fingerprint of the Kani
  #   inputs (every file under kani/ but kani/local and the Markdown, with
  #   the git object ids of kani/src, Cargo.toml, Cargo.lock, mutants,
  #   run.sh and .gitignore on their own lines; the source-mirror gitlink
  #   and conformance/traces/core.txt; versions.env's KANI and CBMC), each
  #   harness's and mutant's result, time, peak and limit, and the
  #   harnesses' covers.
  # kani-large and kani-mutants-large run only when the KANI_RUNNER
  # repository variable names a runner with at least 49 GB (1.25 times
  # h_wedge's peak), not ubuntu-latest, and this run is not routed (see
  # above `jobs:`): the pin job's `large` output. The kani-record job
  # (tools/scripts/check-kani-record.py) checks the record on every run: it
  # fails when the record's fingerprint is not this commit's ("re-run the
  # local Kani record"), a recorded harness is not ok or a recorded mutant
  # not as its patch expects, or the record and the kani groups do not
  # cover `run.sh list` exactly once (kani-large's groups must be the
  # recorded harnesses; the same for the mutants). The covers job counts
  # the recorded harnesses and their covers with the groups'. A stale
  # record is only a warning when this run verifies everything it records:
  # kani-large its harnesses and kani-mutants-large (manual, `mutants`)
  # its mutants, both on KANI_RUNNER.
  # The Kani jobs take KANI_RUNNER, then CI_RUNNER, then ubuntu-latest, as
  # near-approval's do; routed runs always get ubuntu-latest (and the local
  # record). A group that runs out of time fails (TIMEOUT in the job's
  # output and logs). Nothing is skipped: a group passes only if every
  # harness in it does. A runner whose memory plus swap is below a group's
  # peak fails that group at once (the runner-size step), and so does, in
  # kani-large and kani-mutants-large, a hosted runner whose memory is.
  #
  # Per group: gb is the largest measured peak, rounded up. KANI_MAX_GB is
  # 1.5 times gb: a harness that needs half as much again as it did has
  # changed, and is stopped (OUT-OF-MEMORY) instead of swapping for hours.
  # run.sh compares resident memory, which cannot exceed the runner's RAM,
  # so on ubuntu-latest a cap of 16 GB or more never fires; there the
  # kernel's OOM killer stops a harness that exhausts memory and swap
  # (FAILED). (The local run keeps run.sh's default cap, 40 GB.)
  # KANI_TIMEOUT, per harness, is three times the slowest measured time in
  # the group, and at least run.sh's 1800 s (it replaces run.sh's 7200 s for
  # the _inv_3 parts, whose slowest took 1788 s). Each group's harnesses
  # times KANI_TIMEOUT fit the 360 minutes. On swap (a runner with less
  # memory than the group's peak) the kani step raises it to each harness's
  # share of 330 minutes.
  # A family's covers can be split across groups and the local record: each
  # group only records its covers (KANI_DEFER_COVERS=1), and the covers job
  # checks them all together, as near-approval's does. That job also fails
  # if a harness of kani/run.sh is in no group (nor the record) or in two.
  # No loop-bounds job: near-approval's U-1 (kani-loops.py) derives a bound
  # for every loop for its cutoff argument. shared-pool claims no cutoff;
  # run.sh sets per-loop bounds and keeps unwinding assertions on, so a
  # bound that is too small fails the harness instead of hiding a path.
  plain:
    # The Kani harness bodies with a random source (kani/run.sh plain): 27
    # tests, 2,000 to 2,000,000 samples each, and REF-1..3 over every call
    # of the 212 conformance traces. Testing, not proof. 10 s of tests on
    # the reference machine; the rest is the toolchain and a cold build.
    needs: pin
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Toolchain from versions.env
        run: |
          . tools/versions.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          # For this job only: `rustup default` would outlive it on a
          # self-hosted runner.
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        # Hosted runners only: a self-hosted runner's CARGO_HOME persists and
        # is shared by every repository's jobs.
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            projects/shared-pool/kani/target
          key: sp-plain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env', 'projects/shared-pool/kani/Cargo.lock') }}
      - name: Plain mode (random source; testing, not proof)
        run: projects/shared-pool/kani/run.sh plain

  mutants:
    # The 31 mutants of kani/mutants in plain mode (kani/run.sh mutants):
    # each must-kill patch (30: 29 of the core, 1 of the TLA+ transcription
    # tla.rs) must make a plain test fail, and the equivalent mutant 20
    # (must-survive) must pass. 243 to 266 s on the reference machine.
    needs: pin
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Toolchain from versions.env
        run: |
          . tools/versions.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          # For this job only: `rustup default` would outlive it on a
          # self-hosted runner.
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Core and tla.rs mutants, plain mode (run.sh mutants)
        env:
          KEEP_LOGS: ${{ runner.temp }}/kani-mutant-logs
        run: |
          # run.sh copies each mutant's log into KEEP_LOGS but does not
          # create it.
          mkdir -p "$KEEP_LOGS"
          projects/shared-pool/kani/run.sh mutants
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kani-mutant-logs-plain
          path: ${{ runner.temp }}/kani-mutant-logs
          retention-days: 14

  kani:
    # The groups that peaked at 13 GB or less: every harness of them on the
    # real pool-core (kani/run.sh kani <group>), with unwinding assertions
    # on: each must verify, h_canary must FAIL on its own assertion only.
    # Groups, runners and limits: see above `plain:`.
    needs: pin
    if: needs.pin.outputs.kani == 'true'
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'claude/') || contains(github.event.pull_request.body, 'claude.ai/code/session_') || github.event.head_commit.committer.email == 'noreply@anthropic.com') && 'ubuntu-latest' || vars.KANI_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    # The hosted-runner cap. Each group's harnesses times KANI_TIMEOUT, plus
    # setup and codegen, fits in it.
    timeout-minutes: 360
    env:
      KANI_SWAP_GB: ${{ vars.KANI_SWAP_GB || '16' }}
      GB: ${{ matrix.gb }}
    strategy:
      fail-fast: false
      matrix:
        # group: harnesses, run one at a time; gb: the largest peak in
        # kani/RESULTS.md, rounded up, at most 13 here (in memory on
        # ubuntu-latest); timeout: KANI_TIMEOUT (seconds per harness; more
        # on swap, see the kani step). These groups, and kani-large's or
        # the local record's harnesses, are every harness of kani/run.sh
        # once (tools/scripts/check-kani-record.py, the covers job).
        include:
          - { group: "h_canary h_full_256 h_best h_live1 h_wedge_healthy", gb: 11, timeout: 1800 }
          - { group: "h_init_inv h_init_inv_2 h_version_max_pause h_version_max_ack h_version_max_dispatch h_version_max_observe h_version_max_cancel h_version_max_settle", gb: 12, timeout: 1800 }
          - { group: "h_step_ack_tx h_step_ack_post h_step_ack_inv h_step_ack_inv_0 h_step_ack_inv_1 h_step_ack_inv_3 h_step_ack_cov", gb: 13, timeout: 1800 }
          - { group: "h_step_dispatch_tx h_step_dispatch_post h_step_dispatch_inv h_step_dispatch_inv_0 h_step_dispatch_inv_1 h_step_dispatch_inv_3 h_step_dispatch_cov", gb: 13, timeout: 1800 }
          - { group: "h_step_pause_tx h_step_pause_post h_step_pause_inv h_step_pause_inv_0 h_step_pause_inv_1 h_step_pause_inv_3 h_step_pause_cov", gb: 13, timeout: 1800 }
          - { group: "h_step_observe_tx h_step_observe_post h_step_observe_inv h_step_observe_inv_0 h_step_observe_inv_1 h_step_observe_cov", gb: 12, timeout: 1800 }
          - { group: "h_step_cancel_tx h_step_cancel_inv_0 h_step_cancel_inv_1 h_step_cancel_cov h_step_settle_inv_0 h_step_settle_cov", gb: 13, timeout: 1800 }
          - { group: "h_ref_submit h_ref_dispatch h_ref_ack h_ref_cancel h_ref_settle h_ref_pause h_ref_observe", gb: 13, timeout: 1800 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Install Kani (and the CBMC it bundles)
        run: |
          . tools/versions.env
          cargo install --locked kani-verifier --version "$KANI"
          # `cargo kani setup` always re-downloads the bundle; on a persistent
          # self-hosted HOME skip it once the bundle and its toolchain link
          # (setup's last step) are in place.
          kani_dir="${KANI_HOME:-$HOME/.kani}/kani-$KANI"
          if [ ! -x "$kani_dir/bin/cbmc" ] || [ ! -d "$kani_dir/toolchain/bin" ]; then
            cargo kani setup
          fi
      - name: Check CBMC version
        run: |
          . tools/versions.env
          # The pinned version's own CBMC: a persistent HOME may hold others.
          cbmc_bin="${KANI_HOME:-$HOME/.kani}/kani-$KANI/bin/cbmc"
          "$cbmc_bin" --version | grep -q "^$CBMC" || { echo "CBMC is not $CBMC"; "$cbmc_bin" --version; exit 1; }
      - name: Swap, a margin over the measured peak
        # Hosted Linux only: it deletes SDKs and replaces the host's swap
        # with sudo, which a self-hosted runner must not do (and macOS sizes
        # its own swap). This job's entries peaked at 13 GB or less on
        # macOS and run in memory on ubuntu-latest; the swap file
        # (KANI_SWAP_GB, default 16; 0: none) is a margin for a Linux peak
        # above the macOS one, which leaves out compressed pages. The large
        # entries do not run on hosted swap (see above `plain:`).
        if: env.KANI_SWAP_GB != '0' && runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          # Free preinstalled SDKs this job does not use, for the swap file;
          # leave 6 GB of disk for the build and logs.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          gb=$(( KANI_SWAP_GB < avail - 6 ? KANI_SWAP_GB : avail - 6 ))
          if [ "$gb" -lt 1 ]; then echo "::warning::no disk for swap (${avail} GB free)"; exit 0; fi
          sudo swapoff -a || true
          sudo fallocate -l "${gb}G" /kani.swap
          sudo chmod 600 /kani.swap
          sudo mkswap /kani.swap >/dev/null
          sudo swapon /kani.swap
          echo "::notice::swap ${gb} GB, disk free $(df --output=avail -BG / | tail -1)"
      - name: Runner size against the measured peak
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ram=$(( $(sysctl -n hw.memsize) / 1073741824 )); swap=
          else
            ram=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1048576 ))
            swap=$(( $(awk '/^SwapTotal:/{print $2}' /proc/meminfo) / 1048576 ))
          fi
          echo "::notice::runner has $(getconf _NPROCESSORS_ONLN) CPUs, $ram GB memory, ${swap:-dynamic} GB swap; this job's harnesses peaked at $GB GB (kani/RESULTS.md)"
          if [ "$ram" -lt "$GB" ]; then
            if [ -n "$swap" ] && [ $(( ram + swap )) -lt "$GB" ]; then
              echo "::error::this job's harnesses peaked at $GB GB and the runner has $ram GB of memory and $swap GB of swap: set KANI_RUNNER to a runner with at least $(( (GB * 5 + 3) / 4 )) GB (strategy.md section 14)"
              exit 1
            fi
            echo "::warning::this job's harnesses peaked at $GB GB, above the runner's $ram GB: they run on swap, up to 4 times slower than measured or out of time (CI run 43469880167); KANI_RUNNER names a larger runner (strategy.md section 14)"
          fi
      - name: Kani ${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
          KANI_TIMEOUT: ${{ matrix.timeout }}
          KANI_LOG_DIR: ${{ runner.temp }}/kani-logs
          KANI_DEFER_COVERS: "1"
        run: |
          # 1.5 times the group's measured peak (see above `plain:`).
          export KANI_MAX_GB=$(( (GB * 3 + 1) / 2 ))
          # run.sh reads each harness's loop ids with this CBMC (by default
          # the last ~/.kani/kani-*; a persistent HOME may hold others). Not
          # by sourcing versions.env: run.sh reads KANI as the Kani command.
          v=$(sed -n 's/^KANI=//p' tools/versions.env)
          export KANI_CBMC="${KANI_HOME:-$HOME/.kani}/kani-$v/bin/cbmc"
          # GROUP: harness names separated by spaces.
          read -ra harnesses <<<"$GROUP"
          if [ -r /proc/meminfo ]; then
            ram=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1048576 ))
            # On swap (memory below the group's peak: a KANI_RUNNER or
            # CI_RUNNER smaller than the group, with swap of its own) the
            # measured times do not hold: in CI run 43469880167 harnesses
            # on swap took up to 4.3 times their macOS time, three ran out
            # of time and h_step_submit_inv_3 used 3,586 of its 3,600 s.
            # There each harness may use an equal share of 330 of the job's
            # 360 minutes.
            share=$(( 330 * 60 / ${#harnesses[@]} ))
            if [ "$ram" -lt "$GB" ] && [ "$share" -gt "$KANI_TIMEOUT" ]; then
              echo "::notice::on swap: KANI_TIMEOUT $KANI_TIMEOUT -> $share s per harness (330 minutes over ${#harnesses[@]})"
              export KANI_TIMEOUT=$share
            fi
            # Memory and swap in use every 5 minutes, in the job's output,
            # which survives a runner that goes down (the uploaded logs do
            # not; CI runs 43469880167 and 43488691444 lost runners on
            # swap).
            (while sleep 300; do free -g | awk '/^Mem:/{m=$3} /^Swap:/{w=$3} END{print "memory in use " m " GB, swap in use " w " GB"}'; done) &
            sampler=$!
            trap 'pkill -P "$sampler" 2>/dev/null; kill "$sampler" 2>/dev/null || true' EXIT
          fi
          projects/shared-pool/kani/run.sh kani "${harnesses[@]}"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kani-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/kani-logs
          retention-days: 14

  kani-large:
    # The groups that peaked above 13 GB, run as the kani job runs its
    # own, on KANI_RUNNER only: the pin job's `large` output is true when
    # KANI_RUNNER is set, is not ubuntu-latest, and this run is not routed,
    # so the runs-on below resolves to it. Without it kani-record checks
    # these groups' local record instead (see above `plain:`). No swap
    # step: on hosted swap these groups failed or crawled, so a hosted
    # KANI_RUNNER must hold them in memory (the runner-size step).
