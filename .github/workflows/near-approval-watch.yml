# Upstream polling is separate from verification of formalver changes.
name: near-approval-watch

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "41 4 * * 0"
  workflow_dispatch:
    inputs:
      mutants:
        description: Also run the expensive mutation suites
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/near-approval-watch.yml
      - tools/scripts/approval-changed.sh
      - tools/scripts/test-approval-changed.sh
      - tools/scripts/record-approval-check.sh
      - tools/scripts/test-record-approval-check.sh

permissions:
  contents: read

concurrency:
  group: near-approval-watch-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.contract.outputs.contract_changed }}
      source_ref: ${{ steps.contract.outputs.source_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Test the watcher and recording scripts
        run: |
          tools/scripts/test-approval-changed.sh
          tools/scripts/test-record-approval-check.sh
      - name: Check approval contract code, not unrelated upstream changes
        id: contract
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: tools/scripts/approval-changed.sh

  verify:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/near-approval.yml
    with:
      source_ref: ${{ needs.detect.outputs.source_ref }}
      mutants: ${{ github.event.schedule == '41 4 * * 0' || inputs.mutants == true }}
      sandbox: true

  record-upstream:
    needs: [detect, verify]
    if: needs.detect.outputs.changed == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    concurrency:
      group: near-approval-record-upstream
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Propose the successfully checked upstream tip
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SEEN: ${{ needs.detect.outputs.source_ref }}
        run: tools/scripts/record-approval-check.sh "$SEEN"
