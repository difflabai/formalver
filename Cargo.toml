[workspace]
members = [
    "projects/ironclaw/verus",
]
# Standalone crates and the upstream mirror stay out of the root workspace:
# their in-tree path dependencies would otherwise become members and pull borsh.
exclude = [
    "projects/near-approval/source-mirror",
    "projects/near-approval/kani",
    "projects/near-approval/near-tests",
    "projects/near-approval/sandbox",
    "near-proofs",
]
resolver = "2"
