# Mutants run-verus.sh applies one at a time to a copy of src/; each must
# make Verus report an error (strategy.md §7 hygiene gate). `old` must occur
# exactly once in `file`. Spec mutants check the specs are not vacuous; code
# mutants check the refinement postconditions bite. Paired mutants (`edit`
# lists) change the spec and the code the same way, so the refinement still
# holds: only the property lemmas (props.rs, hist.rs, runs.rs, inv.rs) can
# reject them.

[[mutant]]
id = "spec-sod"
what = "approve_spec drops separation of duties"
file = "abs.rs"
old = """            } else if c.signer == r.agent_account_id {
                Err(ApprovalError::SelfApproval)
            } else if s.log.len() == u64::MAX {"""
new = """            } else if s.log.len() == u64::MAX {"""

