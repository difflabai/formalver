  LEAN-LIVE = { status = "in-progress", layer = "lean", evidence = "model-proof", cross = ["tla"], harness = "live1, live1_sf, live1_of_live1Inf, unfair_violates, fair_witness (Liveness.lean, LivenessWitness.lean)", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "Lean: TLA-LIVE-1 for every behaviour at every size (any key, account and payload types, any MaxPending, any number of requests and registrations, any step relation, so both Next and MC_Liveness's BNext); TLA-LIVE-1s under strong fairness; a concrete unfair behaviour violates Live1 and a fair one satisfies its premise. TLA-LIVE-1 without TLC's bounds" }
