# deploy-checks/check_deployment.py; CHECK_<KEY> environment variables override).
[deployment.testnet]        # template: no testnet deployment yet (M7 decision pending)
contract_account = ""
expected_code_hash = ""     # NEAR code_hash, base58(sha256) of the reproducible build
wasm_sha256 = ""            # hex
rpc_url = ""                # archival RPC (VER-2, VER-3, VER-8 read past blocks)
lock_tx_hash = ""           # DEP-1.2: deploy + new + delete every full-access key, one tx signed by C
