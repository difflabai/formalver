[project]
name = "near-approval"
upstream = "https://github.com/difflabai/trust-framework"
upstream_path = "contracts/approval"
pinned_commit = "8635ca7b8b1d64bb226eb0b3b3a35779fcbf461b"   # trust-framework main (2026-10-14); code identical to PR #15 head 3426c92, only README.md differs (OQ-1)
last_reviewed = "2026-10-14"
verus_min_verified = 0      # raised at M5; run-verus.sh fails below it
mc1_state_floor = 51568     # recorded at M4 (2026-10-11); MC-1 fails below it
release_overflow_checks = true  # ASM-COMPILE: check-pin.sh fails unless upstream [profile.release] sets overflow-checks = true

# Status values: unverified | in-progress | verified | verified-with-assumptions | stale
# Assumption keys: `source` cites where the NEAR behaviour (or tool behaviour) an
# assumption relies on is specified, checked against [protocol_reference];
# `arena_excludes` names the near-proof-arena scope exclusions that currently
# keep a machine-checked model of it out of reach (see near-proofs/).
# Optional property keys (backward-compatible with the ironclaw format), see strategy.md section 12:
#   id, evidence (proof | model-proof | bounded-proof | model-check | test | review | check), layer, cross,
#   harness, depends_on (relative to upstream_path), assumptions, blocked_by
# A Kani result is at most verified-with-assumptions / bounded-proof.
# Lean (section 18) proves the TLA+ model's properties at every size: model-proof.
# Only Verus on the real core (M5 path A) yields evidence = proof; status stays
# verified-with-assumptions while TRUSTED.toml or the property's assumptions are non-empty.
# Allowed evidence per layer: strategy.md section 12.
# The `evidence` value on each property is the TARGET evidence for that property.

[review]
spec_reviewer = ""          # a named human who did not write approval-core; required before any K/V property is verified*
spec_reviewed_at = ""

[tools]
lean = "4.34.1"             # release zip, no elan; near-proof-arena's pin
