  TLA-LIVE-2 = { status = "in-progress", layer = "tla", evidence = "bounded-proof", cross = ["kani"], harness = "MC_Apalache, MC_Safety", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-TLA-SCOPE", "ASM-TOOLS", "ASM-SPEC"], description = "Approvable: every Approver key of another account can approve or reject a pending request (no accepted request is stuck in the core)" }
