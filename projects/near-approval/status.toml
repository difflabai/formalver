[project]
name = "near-approval"
upstream = "https://github.com/difflabai/trust-framework"
upstream_path = "contracts/approval"
pinned_commit = "18f57cb218f391d59d14f9db68dd2dd6951d71fb"   # trust-framework main (2026-10-20): PR #19, #20 and #22 (approvals as a loop the Verus twin and Kani both check; no behaviour change)
last_reviewed = "2026-10-20"
verus_min_verified = 95     # M5 path A (2026-10-20): twin + property lemmas; run-verus.sh fails below it
mc1_state_floor = 51568     # recorded at M4 (2026-10-11); MC-1 fails below it
# RT-CODEHASH: `cargo near build reproducible-wasm` of the pin (sandbox job
# asserts it; recompute on every pin bump). Take it from trust-framework's
# `reproducible wasm` job on the pinned main commit: the build metadata names
# the commit, so a PR-head build of the same source hashes differently.
# sandbox/results/RT-CODEHASH.json records the same build and moves with it.
reproducible_wasm_sha256 = "a0f02b21e7013aeb8496a57923611181bf7842e008f9b7600ade4904c6d288f7"
reproducible_code_hash = "BqEdznmvQiCG6XKTgpXbzEptV3GuL3VF274uUqkoseCv"
release_overflow_checks = true  # ASM-COMPILE: check-pin.sh fails unless upstream [profile.release] sets overflow-checks = true

# Status values: unverified | in-progress | verified | verified-with-assumptions | stale
# Assumption keys: `source` cites where the NEAR behaviour (or tool behaviour) an
# assumption relies on is specified, checked against [protocol_reference];
# `arena_excludes` names the near-proof-arena scope exclusions that currently
# keep a machine-checked model of it out of reach (see near-proofs/).
# Optional property keys (backward-compatible with the ironclaw format), see strategy.md section 12:
#   id, evidence (proof | model-proof | bounded-proof | model-check | test | review | check), layer, cross,
#   harness, depends_on (relative to upstream_path), assumptions, blocked_by
# A Kani result is at most verified-with-assumptions / bounded-proof.
# Lean (section 18) proves the TLA+ model's properties at every size: model-proof.
# Only Verus on the real core (M5 path A) yields evidence = proof; status stays
# verified-with-assumptions while TRUSTED.toml or the property's assumptions are non-empty.
# Allowed evidence per layer: strategy.md section 12.
# The `evidence` value on each property is the TARGET evidence for that property.

[review]
spec_reviewer = ""          # a named human who did not write approval-core; required before any K/V property is verified*
spec_reviewed_at = ""

[tools]
lean = "4.34.1"             # release zip, no elan; near-proof-arena's pin
tla2tools = "1.7.4"         # last stable release; the 1.8.0 asset is a rolling build
apalache = "0.47.2"
kani = "0.68.0"             # built from tag kani-0.68.0; nightly-2026-08-21
cbmc = "6.11.0"
verus = "0.2026.10.04.426d8b0"  # weekly release; needs rustup 1.98.1
scryer_prolog = "0.10.0"     # crates.io, cargo install --locked
cargo_near = "0.22.0"            # M6 local builds (release binary); the reproducible image pins its own
near_sandbox = "2.13.4"         # near-workspaces 0.23.0 / near-sandbox 0.3.16 default (M6)
near_sdk = "5.29.1"         # from source-mirror Cargo.lock
borsh = "1.8.1"             # from source-mirror Cargo.lock

[protocol_reference]        # what each assumption's `source` was read against
nomicon_commit = "a013a3fc08bdb50c9f39a1c7f62942bcc3107257"   # near/nearcore master (docs/ is nomicon.io), read 2026-10-09
nearcore = "2.13.4"          # near-sandbox 2.13.4, commit 44f7ae6cd7ef08bab604e20a473bf77e35d4c993: what the RT-* tests ran on (M6)
protocol_version = "86"       # ditto (RPC status of the sandbox)
near_proof_arena = "cb16c4090a82a6179d8e1a23d6e83e74e9d5d017"  # contract v1; tools/upstream-watch.toml tracks changes

[source_hashes]             # sha256 at pinned_commit; check-pin.sh recomputes
"Cargo.toml" = "1cbed4b212bec393ad67cdd2179357355a6b137694c1b604638b2f3e6ee382af"
"Cargo.lock" = "3ef5ab18d24eb2fb74fc3033c9d2fefa611568b6e401127de8eb91557791b939"
