# ---------------------------------------------------------------------------
# Trust assumptions (strategy.md section 3.3). level: high | med | low | policy | n/a
# ---------------------------------------------------------------------------

[assumptions.ASM-SIGNER]
statement = "signer_account_pk() is the key whose signature over the originating tx was verified, an access key of signer_account_id(); signatures unforgeable"
level = "high"
checked_by = ["RT-KEY"]
status = "unverified"

[assumptions.ASM-PRED]
statement = "predecessor_account_id() is unforgeable; equals the signer for the first receipt and when code on the signer's own account calls (F-9)"
level = "high"
checked_by = ["RT-RELAY", "RT-SELFACCT"]
status = "unverified"

[assumptions.ASM-ATOMIC]
statement = "Atomicity is per receipt: panic, out-of-gas or LackBalanceForState reverts all writes, including earlier actions batched in the same receipt; logs of a failed receipt may remain"
level = "med"
checked_by = ["RT-REVERT", "RT-BATCH"]
status = "unverified"

[assumptions.ASM-SEQ]
statement = "Receipts on one account execute one at a time; the contract creates no promises, so no reentrancy; each successful action is one model step"
level = "high"
checked_by = ["SH-12"]
status = "unverified"

[assumptions.ASM-TIME]
statement = "block_height and block_timestamp never decrease across receipts on one account"
level = "med"
checked_by = []
status = "unverified"

[assumptions.ASM-FINAL]
statement = "State at finality 'final' is never reverted"
level = "high"
checked_by = []
status = "unverified"

[assumptions.ASM-CODE]
statement = "Code changes only via DeployContract or UseGlobalContract on C (both need a full-access key on C), or via DeployGlobalContract by the owner of a NEP-591 global contract C references by account id; DeleteAccount erases state and a recreated account starts empty"
level = "med"
checked_by = ["RT-RESET", "DEP-1"]
status = "unverified"

[assumptions.ASM-SDK]
statement = "#[init] panics if state exists; #[private] requires predecessor = current account; non-payable change methods reject deposits; &self never writes; only #[near] impl methods exported; PanicOnDefault blocks default init"
level = "high"
checked_by = ["SH-9", "SH-10", "SH-11"]
status = "unverified"

[assumptions.ASM-STORE]
statement = "store::LookupMap is a map keyed prefix ++ borsh(key); writes flushed when the contract struct drops after state_write"
level = "med"
checked_by = ["ST-4", "ST-5", "ST-6"]
status = "unverified"

[assumptions.ASM-IDENT]
statement = "PartialEq on AccountId/PublicKey is an equivalence matching Borsh-byte equality; the core uses A/K only via Clone and PartialEq (parametricity justifies small identities); harnesses use opaque newtypes so a new trait bound breaks the build"
level = "high"
checked_by = []
status = "unverified"

[assumptions.ASM-STAKE]
statement = "Account must hold storage_usage * 1e19 yocto; ~40 B overhead per record"
level = "med"
checked_by = ["RES-1"]
status = "unverified"

[assumptions.ASM-LIMITS]
statement = "max_total_log_length 16384 B; 100 logs; 4 MiB return data; 300 TGas per call; view gas cap per node"
level = "med"
checked_by = ["RES-2", "RES-3"]
status = "unverified"

[assumptions.ASM-META]
statement = "NEP-366 (and NEP-518 eth-implicit) inner receipts carry the relayer as signer, so relayed calls fail IndirectCall"
level = "med"
checked_by = ["RT-METATX"]
status = "unverified"

[assumptions.ASM-FCKEY]
statement = "Function-call keys restrict receiver and methods, cannot attach deposits, have an allowance, and cannot add keys"
level = "high"
checked_by = ["RT-FCKEY"]
status = "unverified"

[assumptions.ASM-COMPILE]
statement = "rustc/LLVM/wasm-opt preserve core semantics host -> wasm32; overflow-checks on in release; the only on-chain usize use is action.len() > MAX_ACTION_LEN; cfg(feature=\"borsh\") gates only use/derive"
level = "n/a"
checked_by = ["RT-CODEHASH", "RT-TRACE"]
status = "unverified"

[assumptions.ASM-MODEL]
statement = "Until M5 path A: a core step on a state larger than the Kani bound behaves like one within it (strategy section 6.3)"
level = "med"
checked_by = ["MC-2"]
status = "unverified"

[assumptions.ASM-TLA-SCOPE]
statement = "TLA+ model bounds (strategy section 17.3): behaviours with more requests, keys or accounts than TLC and Apalache explore add no new violations. Accounts and keys are covered by ASM-IDENT parametricity; the request bound is a small-scope assumption"
level = "med"
checked_by = ["TLA-IND", "REF-5"]
status = "unverified"

[assumptions.ASM-SPEC]
statement = "spec.rs, the Verus specs and the Prolog requirements state the intended behaviour; signed off by a human who did not write approval-core"
level = "n/a"
checked_by = ["C-7", "MC-2"]
status = "unverified"

[assumptions.ASM-TOOLS]
statement = "Kani (unwinding assertions on), Verus+Z3 and scryer-prolog are sound at the pinned versions"
level = "n/a"
checked_by = []
status = "unverified"

[assumptions.ASM-OWNER]
statement = "The owner registers keys honestly (it could otherwise register two accounts it controls)"
level = "policy"
checked_by = ["DEP-1", "VER-4"]
status = "unverified"

[assumptions.ASM-DEPLOY]
statement = "The deployed code is the reproducible build of the pin, locked at deploy"
level = "policy"
checked_by = ["DEP-1", "VER-2", "VER-3"]
status = "unverified"

[assumptions.ASM-DISPLAY]
statement = "Approver UIs render the action text faithfully (the approve tx commits to the text itself)"
level = "policy"
checked_by = []
status = "unverified"

[assumptions.ASM-STRLEN]
statement = "(M5 only) String::len is the UTF-8 byte length; is_empty <=> len == 0"
level = "high"
checked_by = []
status = "unverified"

# ---------------------------------------------------------------------------
[modules.requirements]
source = "README.md"
verus_model = ""
prolog_requirements = "prolog/requirements/approval_req.pl"

  [modules.requirements.properties]
  C-1 = { status = "unverified", layer = "prolog", evidence = "check", depends_on = ["README.md"], description = "Authority matrix: one authority per change method; owner/agent/approver method sets disjoint; no key can both request and approve" }
  C-2 = { status = "unverified", layer = "prolog", evidence = "check", depends_on = ["core/src/lib.rs"], description = "Guard table: every ApprovalError produced by >=1 guard; specified precedence equals generated code_precedence/2" }
  C-3 = { status = "unverified", layer = "prolog", evidence = "check", depends_on = ["core/src/lib.rs"], description = "Error messages pairwise distinct and substring-free" }
  C-4 = { status = "unverified", layer = "prolog", evidence = "check", depends_on = ["contract/src/lib.rs", "README.md"], description = "Each event from exactly one method; authority/proof-changing ops emit an event or carry accepted_risk (admin ops: F-8)" }
  C-5 = { status = "unverified", layer = "prolog", evidence = "check", depends_on = ["core/src/lib.rs"], description = "Generated constants equal requirement constants; DEFAULT_PAGE_SIZE <= MAX_PAGE_SIZE; MAX_PENDING_PER_KEY >= 1; MAX_ACTION_LEN within RES-2 bound" }
  C-6 = { status = "unverified", layer = "prolog", evidence = "check", depends_on = ["contract/src/lib.rs"], description = "Generated API surface (wasm exports + ABI) equals the requirements API table" }
  C-7 = { status = "unverified", layer = "prolog", evidence = "check", depends_on = ["README.md"], description = "Traceability both ways: every requirement has >=1 property; every property traces to a requirement or threat" }
  C-8 = { status = "unverified", layer = "prolog", evidence = "check", description = "Every threat has mitigated_by or accepted_risk" }
  C-9 = { status = "unverified", layer = "prolog", evidence = "check", description = "Property and assumption IDs in status.toml equal those in traceability.pl" }
  C-10 = { status = "unverified", layer = "prolog", evidence = "check", description = "Warn when a verified* property depends on an assumption with level below high whose check has not passed" }
  MC-1 = { status = "unverified", layer = "prolog", evidence = "model-check", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-SPEC"], description = "Bounded model check of reference step/4 at depth 6 with real constants: no INV, separation-of-duties, double-approval, pending-count or revival violation; reaches approved and void states and every error except both LogFull and TooManyPending; MC-1s (max_pending=2, max_u=2) also reaches TooManyPending and request LogFull; state counts >= mc1_state_floor" }
  MC-2 = { status = "unverified", layer = "prolog", evidence = "test", cross = ["plain", "sandbox"], depends_on = ["core/src/lib.rs"], assumptions = ["ASM-SPEC"], description = "Generated traces replayed on the real core, on spec.rs and (RT-TRACE) on the wasm; all agree" }

