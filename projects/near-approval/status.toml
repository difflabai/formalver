# ---------------------------------------------------------------------------
# Trust assumptions (strategy.md section 3.3). level: high | med | low | policy | n/a
# ---------------------------------------------------------------------------

[assumptions.ASM-SIGNER]
statement = "signer_account_pk() is the key whose signature over the originating tx was verified, an access key of signer_account_id(); signatures unforgeable"
level = "high"
checked_by = ["RT-KEY"]
source = ["https://nomicon.io/DataStructures/AccessKey.html", "https://nomicon.io/RuntimeSpec/Transactions.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/ContextAPI.html"]
arena_excludes = ["transactions", "signature_verification"]
status = "unverified"

[assumptions.ASM-PRED]
statement = "predecessor_account_id() is unforgeable; equals the signer for the first receipt and when code on the signer's own account calls (F-9)"
level = "high"
checked_by = ["RT-RELAY", "RT-SELFACCT"]
source = ["https://nomicon.io/RuntimeSpec/Receipts.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/ContextAPI.html", "https://nomicon.io/RuntimeSpec/Scenarios/CrossContractCall.html"]
arena_excludes = ["function_calls_and_wasm"]
status = "unverified"

[assumptions.ASM-ATOMIC]
statement = "Atomicity is per receipt: panic, out-of-gas or LackBalanceForState reverts all writes, including earlier actions batched in the same receipt; logs of a failed receipt may remain"
level = "med"
checked_by = ["RT-REVERT", "RT-BATCH"]
source = ["https://nomicon.io/RuntimeSpec/Receipts.html", "https://nomicon.io/RuntimeSpec/Actions.html", "https://nomicon.io/DataStructures/Account.html"]
arena_excludes = ["failure_paths_and_rollback", "function_calls_and_wasm"]
status = "unverified"

[assumptions.ASM-SEQ]
statement = "Receipts on one account execute one at a time; the contract creates no promises, so no reentrancy; each successful action is one model step"
level = "high"
checked_by = ["SH-12"]
source = ["https://nomicon.io/RuntimeSpec/ApplyingChunk.html", "https://nomicon.io/RuntimeSpec/Runtime.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/PromisesAPI.html"]
arena_excludes = ["function_calls_and_wasm", "delayed_receipt_queue"]
status = "unverified"

[assumptions.ASM-TIME]
statement = "block_height and block_timestamp never decrease across receipts on one account"
level = "med"
checked_by = []
source = ["https://nomicon.io/RuntimeSpec/Components/BindingsSpec/ContextAPI.html", "https://nomicon.io/ChainSpec/BlockProcessing.html"]
arena_excludes = ["block_finality"]
status = "unverified"

[assumptions.ASM-FINAL]
statement = "State at finality 'final' is never reverted"
level = "high"
checked_by = []
source = ["https://nomicon.io/ChainSpec/Consensus.html"]
arena_excludes = ["block_finality"]
status = "unverified"

[assumptions.ASM-CODE]
statement = "Code changes only via DeployContract or UseGlobalContract on C (both need a full-access key on C), or via DeployGlobalContract by the owner of a NEP-591 global contract C references by account id; DeleteAccount erases state and a recreated account starts empty"
level = "med"
checked_by = ["RT-RESET", "DEP-1"]
source = ["https://nomicon.io/RuntimeSpec/Actions.html", "https://github.com/near/NEPs/blob/master/neps/nep-0591.md"]
arena_excludes = ["non_transfer_actions", "account_v2_global_contracts"]
status = "unverified"

[assumptions.ASM-SDK]
statement = "#[init] panics if state exists; #[private] requires predecessor = current account; non-payable change methods reject deposits; &self never writes; only #[near] impl methods exported; PanicOnDefault blocks default init"
level = "high"
checked_by = ["SH-9", "SH-10", "SH-11"]
source = ["https://docs.rs/near-sdk/5.29.1/near_sdk/"]
status = "unverified"

[assumptions.ASM-STORE]
statement = "store::LookupMap is a map keyed prefix ++ borsh(key); writes flushed when the contract struct drops after state_write"
level = "med"
checked_by = ["ST-4", "ST-5", "ST-6"]
source = ["https://docs.rs/near-sdk/5.29.1/near_sdk/store/struct.LookupMap.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/TrieAPI.html"]
status = "unverified"

[assumptions.ASM-IDENT]
statement = "PartialEq on AccountId/PublicKey is an equivalence matching Borsh-byte equality; the core uses A/K only via Clone and PartialEq (parametricity justifies small identities); harnesses use opaque newtypes so a new trait bound breaks the build"
level = "high"
checked_by = []
source = ["https://docs.rs/near-sdk/5.29.1/near_sdk/struct.PublicKey.html", "https://nomicon.io/DataStructures/Account.html"]
status = "unverified"

[assumptions.ASM-STAKE]
statement = "Account must hold storage_usage * 1e19 yocto; ~40 B overhead per record"
level = "med"
checked_by = ["RES-1"]
source = ["https://nomicon.io/DataStructures/Account.html", "https://nomicon.io/GenesisConfig/RuntimeConfig.html"]
arena_excludes = ["non_transfer_actions"]
status = "unverified"

[assumptions.ASM-LIMITS]
statement = "max_total_log_length 16384 B; 100 logs; 4 MiB return data; 300 TGas per call; view gas cap per node"
level = "med"
checked_by = ["RES-2", "RES-3"]
source = ["https://nomicon.io/GenesisConfig/VMConfig.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/MiscellaneousAPI.html"]
arena_excludes = ["function_calls_and_wasm"]
status = "unverified"

[assumptions.ASM-META]
statement = "NEP-366 (and NEP-518 eth-implicit) inner receipts carry the relayer as signer, so relayed calls fail IndirectCall"
level = "med"
checked_by = ["RT-METATX"]
source = ["https://github.com/near/NEPs/blob/master/neps/nep-0366.md", "https://github.com/near/NEPs/blob/master/neps/nep-0518.md", "https://nomicon.io/RuntimeSpec/Actions.html#delegateaction", "https://nomicon.io/architecture/how/meta-tx.html"]
arena_excludes = ["transactions", "signature_verification", "non_transfer_actions"]
status = "unverified"

[assumptions.ASM-FCKEY]
statement = "Function-call keys restrict receiver and methods, cannot attach deposits, have an allowance, and cannot add keys"
level = "high"
checked_by = ["RT-FCKEY"]
source = ["https://nomicon.io/DataStructures/AccessKey.html#accesskeypermissionfunctioncall", "https://nomicon.io/RuntimeSpec/Transactions.html"]
arena_excludes = ["transactions", "signature_verification", "non_transfer_actions"]
status = "unverified"

[assumptions.ASM-COMPILE]
statement = "rustc/LLVM/wasm-opt preserve core semantics host -> wasm32; overflow-checks on in release; the only on-chain usize use is action.len() > MAX_ACTION_LEN; cfg(feature=\"borsh\") gates only use/derive"
level = "n/a"
checked_by = ["RT-CODEHASH", "RT-TRACE"]
source = ["https://doc.rust-lang.org/cargo/reference/profiles.html#overflow-checks"]
status = "unverified"

[assumptions.ASM-MODEL]
statement = "Until M5 path A: a core step on a state larger than the Kani bound behaves like one within it (strategy section 6.3)"
level = "med"
checked_by = ["MC-2"]
status = "unverified"

[assumptions.ASM-TLA-SCOPE]
statement = "TLA+ model bounds (strategy section 17.3): behaviours with more requests, keys or accounts than TLC and Apalache explore add no new violations. Accounts and keys are covered by ASM-IDENT parametricity; the request bound is a small-scope assumption. Since section 18 it is needed only for liveness (TLA-LIVE-1): LEAN-IND, LEAN-STEP and LEAN-TR prove the safety properties at every size"
level = "med"
checked_by = ["TLA-IND", "REF-5", "LEAN-IND"]
status = "unverified"

[assumptions.ASM-LEAN-TLA]
statement = "The Lean machine (lean/ApprovalLean/Machine.lean, Props.lean) transcribes ApprovalCore.tla and ApprovalProps.tla (strategy section 18)"
level = "high"
checked_by = ["MC-4", "REF-5L"]
status = "unverified"

[assumptions.ASM-SPEC]
statement = "spec.rs, the Verus specs and the Prolog requirements state the intended behaviour; signed off by a human who did not write approval-core"
level = "n/a"
checked_by = ["C-7", "MC-2"]
status = "unverified"

[assumptions.ASM-TOOLS]
statement = "Kani (unwinding assertions on), Verus+Z3, scryer-prolog, TLC, Apalache and the Lean 4 kernel are sound at the pinned versions"
level = "n/a"
checked_by = []
status = "unverified"

[assumptions.ASM-OWNER]
statement = "The owner registers keys honestly (it could otherwise register two accounts it controls)"
level = "policy"
checked_by = ["DEP-1", "VER-4"]
status = "unverified"

[assumptions.ASM-DEPLOY]
statement = "The deployed code is the reproducible build of the pin, locked at deploy"
level = "policy"
checked_by = ["DEP-1", "VER-2", "VER-3"]
status = "unverified"

[assumptions.ASM-DISPLAY]
statement = "Approver UIs render the action text faithfully (the approve tx commits to the text itself)"
level = "policy"
checked_by = []
status = "unverified"

[assumptions.ASM-STRLEN]
statement = "(M5 only) String::len is the UTF-8 byte length; is_empty <=> len == 0"
level = "high"
checked_by = []
status = "unverified"

# ---------------------------------------------------------------------------
[modules.requirements]
source = "README.md"
verus_model = ""
prolog_requirements = "prolog/requirements/approval_req.pl"

  [modules.requirements.properties]
  C-1 = { status = "verified", layer = "prolog", evidence = "check", depends_on = ["README.md"], description = "Authority matrix: one authority per change method; owner/agent/approver method sets disjoint; no key can both request and approve" }
  C-2 = { status = "verified", layer = "prolog", evidence = "check", depends_on = ["core/src/lib.rs"], description = "Guard table: every ApprovalError produced by >=1 guard; specified precedence equals generated code_precedence/2" }
  C-3 = { status = "verified", layer = "prolog", evidence = "check", depends_on = ["core/src/lib.rs"], description = "Error messages pairwise distinct and substring-free" }
  C-4 = { status = "verified", layer = "prolog", evidence = "check", depends_on = ["contract/src/lib.rs", "README.md"], description = "Each event from exactly one method; authority/proof-changing ops emit an event or carry accepted_risk (admin ops emit key_added / key_revoked since 3426c92)" }
  C-5 = { status = "verified", layer = "prolog", evidence = "check", depends_on = ["core/src/lib.rs"], description = "Generated constants equal requirement constants; DEFAULT_PAGE_SIZE <= MAX_PAGE_SIZE; MAX_PENDING_PER_KEY >= 1; MAX_ACTION_LEN within RES-2 bound" }
  C-6 = { status = "unverified", layer = "prolog", evidence = "check", depends_on = ["contract/src/lib.rs"], description = "Generated API surface (wasm exports + ABI) equals the requirements API table" }
  C-7 = { status = "verified", layer = "prolog", evidence = "check", depends_on = ["README.md"], description = "Traceability both ways: every requirement has >=1 property; every property traces to a requirement or threat" }
  C-8 = { status = "verified", layer = "prolog", evidence = "check", description = "Every threat has mitigated_by or accepted_risk" }
  C-9 = { status = "verified", layer = "prolog", evidence = "check", description = "Property and assumption IDs in status.toml equal those in traceability.pl" }
  C-10 = { status = "verified", layer = "prolog", evidence = "check", description = "Warn when a verified* property depends on an assumption with level below high whose check has not passed" }
  MC-1 = { status = "verified-with-assumptions", layer = "prolog", evidence = "model-check", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-SPEC"], description = "Bounded model check of reference step/4 at depth 6 with real constants: no INV, separation-of-duties, double-approval, pending-count or revival violation; reaches approved and void states and every error except both LogFull and TooManyPending; MC-1s (max_pending=2, max_u=2) also reaches TooManyPending and request LogFull; state counts >= mc1_state_floor" }
  MC-2 = { status = "in-progress", layer = "prolog", evidence = "test", cross = ["plain", "sandbox"], depends_on = ["core/src/lib.rs"], assumptions = ["ASM-SPEC"], description = "Generated traces replayed on the real core, on spec.rs and (RT-TRACE) on the wasm; all agree" }
  C-2t = { status = "verified", layer = "prolog", evidence = "check", cross = ["tla"], depends_on = ["core/src/lib.rs"], description = "Guard table across models: TLA+ GuardOrder = guard/4 order = code_precedence/2" }
  MC-3 = { status = "verified-with-assumptions", layer = "prolog", evidence = "model-check", cross = ["tla"], depends_on = ["core/src/lib.rs"], assumptions = ["ASM-SPEC", "ASM-TOOLS"], description = "Graph equivalence: Prolog step/4 and TLC export the full labelled reachable graph of one small universe; state and edge sets are equal" }

# ---------------------------------------------------------------------------
[modules.core_state_machine]
source = "core/src/lib.rs"
verus_model = "verus/src/"
prolog_requirements = "prolog/model/approval_machine.pl"

  [modules.core_state_machine.properties]
  TX-0 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["plain", "verus"], harness = "h_step_*, h_raw_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Atomic failure: Err => state unchanged; no Store mutator on failure except remove_principal of an absent key (F-6, no-op)" }
  TX-1 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_step_add, h_raw_add", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "add_principal: Ok(principal) <=> caller = owner, key unregistered and G != MAXU; errors NotOwner, KeyAlreadyRegistered, LogFull; P' = P[k -> (acct, role, G, #R, 0)], G' = G + 1" }
  TX-2 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_step_revoke", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "revoke_key: Ok(P(k)) <=> caller = owner and key registered; errors NotOwner, KeyNotRegistered; P' = P minus k, V' = V[P(k).reg -> t]" }
  TX-3 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus"], harness = "h_step_request, h_step_approve, h_step_reject", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "authenticate: Ok <=> predecessor = signer and key registered to signer with role; errors IndirectCall, UnknownKey, WrongRole, KeyAccountMismatch; read-only" }
  TX-4 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_step_request, h_raw_request", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "request_action: exact result, error order (auth, EmptyAction, ActionTooLong, TooManyPending, LogFull), appended request recording the caller's registration id, caller key pend+1" }
  TX-5 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_step_approve", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "approve: exact result, error order (auth, RequestNotFound, AlreadyApproved, AlreadyRejected, AgentRevoked, ActionMismatch, SelfApproval, LogFull), approval recorded with the approver's registration id, log appended, agent key pend-1, proof = approval(s', i)" }
  TX-7 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_step_reject, h_raw_reject", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "reject: exact result, error order (auth, RequestNotFound, AlreadyApproved, AlreadyRejected, AgentRevoked, SelfApproval), rejection recorded with the approver's registration id, agent key pend-1, log unchanged; Ok(R'[i])" }
  TX-6 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["review"], harness = "h_step_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Owner never changes; owner checks compare the caller account passed by the shell (predecessor: SH-1)" }
  INV-0 = { status = "unverified", layer = "kani", evidence = "bounded-proof", cross = ["verus"], harness = "h_store_laws_mem, h_step_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Registry is a function: one registration and role per key (MemStore has no duplicate keys)" }
  INV-1 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_step_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Dense request ids: R[i].id = i" }
  INV-2 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_step_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Stored actions are 1..=2048 bytes" }
  INV-3 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_step_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Log -> request: L[j] < #R and R[L[j]] approved with index j" }
  INV-4 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_step_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Request -> log: approved R[i] has index < #L and L[index] = i" }
  INV-5 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_init, h_step_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Separation of duties: approver account != agent account, on every approval and rejection" }
  INV-6 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus"], harness = "h_init, h_step_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Approver key != agent key on every approval and rejection" }
  INV-7 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus"], harness = "h_step_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Registration bound: P(k).active_from <= #R" }
  INV-8 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["verus", "prolog"], harness = "h_step_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Registration provenance: R[i].ak = k and i >= P(k).active_from => R[i].aa = P(k).account, role Agent and R[i].agent_registration_id = P(k).registration_id" }
