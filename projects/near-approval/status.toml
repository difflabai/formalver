# ---------------------------------------------------------------------------
# Trust assumptions (strategy.md section 3.3). level: high | med | low | policy | n/a
# ---------------------------------------------------------------------------

[assumptions.ASM-SIGNER]
statement = "signer_account_pk() is the key whose signature over the originating tx was verified, an access key of signer_account_id(); signatures unforgeable"
level = "high"
checked_by = ["RT-KEY"]
source = ["https://nomicon.io/DataStructures/AccessKey.html", "https://nomicon.io/RuntimeSpec/Transactions.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/ContextAPI.html"]
arena_excludes = ["transactions", "signature_verification"]
observed = "RT-KEY: function-call keys (ed25519 and secp256k1) arrive as signer = predecessor = their account with signer_pk = the key; an unregistered key on the right account fails UnknownKey; a key registered to another account fails KeyAccountMismatch"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv; every test also passed on the non-reproducible ffdbb5a7...0b90e1, 2026-10-15"
status = "in-progress"

[assumptions.ASM-PRED]
statement = "predecessor_account_id() is unforgeable; equals the signer for the first receipt and when code on the signer's own account calls (F-9)"
level = "high"
checked_by = ["RT-RELAY", "RT-SELFACCT"]
source = ["https://nomicon.io/RuntimeSpec/Receipts.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/ContextAPI.html", "https://nomicon.io/RuntimeSpec/Scenarios/CrossContractCall.html"]
arena_excludes = ["function_calls_and_wasm"]
observed = "RT-RELAY: request_action, approve and reject through a third-party relay contract fail IndirectCall with no log and no state change; a DEP-1.4 key cannot even sign to the relay (ReceiverMismatch). RT-SELFACCT: code on the agent's own account calling C succeeds and is attributed to the agent's full-access key (F-9); a DEP-1.4 key cannot call that code (ReceiverMismatch)"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv; every test also passed on the non-reproducible ffdbb5a7...0b90e1, 2026-10-15"
status = "in-progress"

[assumptions.ASM-ATOMIC]
statement = "Atomicity is per receipt: panic, out-of-gas or LackBalanceForState reverts all writes, including earlier actions batched in the same receipt; logs of a failed receipt may remain"
level = "med"
checked_by = ["RT-REVERT", "RT-BATCH"]
source = ["https://nomicon.io/RuntimeSpec/Receipts.html", "https://nomicon.io/RuntimeSpec/Actions.html", "https://nomicon.io/DataStructures/Account.html"]
arena_excludes = ["failure_paths_and_rollback", "function_calls_and_wasm"]
observed = "RT-REVERT: a core panic, out of gas after the emit and LackBalanceForState (request_action and approve) leave counters, principals, requests and approvals unchanged. The event line SURVIVES in the failed outcome for out of gas (attached gas between about 27/40 and 39/40 of the minimum) and for LackBalanceForState. RT-BATCH: [request_action(a), request_action('')] fails at action index 1, counters unchanged, and the first action's approval_requested line appears in the failed outcome. So VER-1's success requirement is load-bearing"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv; every test also passed on the non-reproducible ffdbb5a7...0b90e1, 2026-10-15"
status = "in-progress"

[assumptions.ASM-SEQ]
statement = "Receipts on one account execute one at a time; the contract creates no promises, so no reentrancy; each successful action is one model step"
level = "high"
checked_by = ["SH-12"]
source = ["https://nomicon.io/RuntimeSpec/ApplyingChunk.html", "https://nomicon.io/RuntimeSpec/Runtime.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/PromisesAPI.html"]
arena_excludes = ["function_calls_and_wasm", "delayed_receipt_queue"]
observed = "SH-12: the wasm imports exactly the 17 env functions in wasm-surface.expected, none of them promise_*, deploy, delete, add-key, global-contract or transfer, so no receipt of C can call out or back in; store_diff.rs: every successful call is exactly one core transition (SH-2). One-receipt-at-a-time execution per account is the runtime's (Nomicon ApplyingChunk), not checked here"
status = "in-progress"

[assumptions.ASM-TIME]
statement = "block_height and block_timestamp never decrease across receipts on one account"
level = "med"
checked_by = ["RT-TIME"]
source = ["https://nomicon.io/RuntimeSpec/Components/BindingsSpec/ContextAPI.html", "https://nomicon.io/ChainSpec/BlockProcessing.html"]
arena_excludes = ["block_finality"]
observed = "RT-TIME: 80 receipts on C (40 requests, 20 approvals, 20 rejections, 80 skipped blocks interleaved): every stored requested_at/approved_at/rejected_at equals the block its receipt ran in, heights strictly increase and timestamps never decrease in execution order. A sample on one sandbox node, not a proof of the chain rule"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv"
status = "in-progress"

[assumptions.ASM-FINAL]
statement = "State at finality 'final' is never reverted"
level = "high"
checked_by = []
source = ["https://nomicon.io/ChainSpec/Consensus.html"]
arena_excludes = ["block_finality"]
status = "unverified"

[assumptions.ASM-CODE]
statement = "Code changes only via DeployContract or UseGlobalContract on C (both need a full-access key on C), or via DeployGlobalContract by the owner of a NEP-591 global contract C references by account id; DeleteAccount erases state and a recreated account starts empty"
level = "med"
checked_by = ["RT-RESET", "DEP-1"]
source = ["https://nomicon.io/RuntimeSpec/Actions.html", "https://github.com/near/NEPs/blob/master/neps/nep-0591.md"]
arena_excludes = ["non_transfer_actions", "account_v2_global_contracts"]
observed = "RT-RESET: an unlocked C deleted and recreated under the same name starts with counters 0; check_deployment VER-3 flags the DeleteAccount, the recreation AddKey and the DeployContract receipts since the original b0"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv; every test also passed on the non-reproducible ffdbb5a7...0b90e1, 2026-10-15"
status = "in-progress"

[assumptions.ASM-SDK]
statement = "#[init] panics if state exists; #[private] requires predecessor = current account; non-payable change methods reject deposits; &self never writes; only #[near] impl methods exported; PanicOnDefault blocks default init"
level = "high"
checked_by = ["SH-9", "SH-10", "SH-11"]
source = ["https://docs.rs/near-sdk/5.29.1/near_sdk/"]
observed = "SH-9: new fails 'Method new is private' from another account; every other method, views included, fails 'The contract is not initialized' before init; post-init views equal Init(owner); a second new fails. SH-10: every change method and new fail 'Method <m> doesn't accept deposit' with 1 yocto; all 9 get_* methods and contract_source_metadata ACCEPT a 1 yocto deposit when called as a transaction (the wrapper checks only &mut self methods). Function exports: the 16 methods plus contract_source_metadata and __contract_abi"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv; every test also passed on the non-reproducible ffdbb5a7...0b90e1, 2026-10-15"
status = "in-progress"

[assumptions.ASM-STORE]
statement = "store::LookupMap is a map keyed prefix ++ borsh(key); writes flushed when the contract struct drops after state_write. For M5 path A: the contract crate's Store impl meets the Store trait's Verus contract (verified for MemStore; tested, not proved, for the NEAR store)"
level = "med"
checked_by = ["ST-4", "ST-5", "ST-6"]
source = ["https://docs.rs/near-sdk/5.29.1/near_sdk/store/struct.LookupMap.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/TrieAPI.html"]
observed = "ST-4: the real contract store, persisted and reloaded before every step, refines MemStore over 10k x 50 random operations; ST-5: after every step the raw keys are exactly STATE and prefix ++ borsh(key) for the entries alpha lists; ST-6: golden Borsh bytes for every record kind (near-sdk 5.29.1 mocked runtime; flush-on-drop exercised by the reload every step)"
status = "in-progress"

[assumptions.ASM-IDENT]
statement = "PartialEq on AccountId/PublicKey is an equivalence matching Borsh-byte equality; the core uses A/K only via Clone and PartialEq (parametricity justifies small identities); harnesses use opaque newtypes so a new trait bound breaks the build"
level = "high"
checked_by = ["ST-7"]
source = ["https://docs.rs/near-sdk/5.29.1/near_sdk/struct.PublicKey.html", "https://nomicon.io/DataStructures/Account.html"]
observed = "ST-7: on near-sdk 5.29.1 / near-sdk-core 4.2.3 / near-account-id 2.6.0, == on AccountId and PublicKey equals Borsh-byte equality, is reflexive and symmetric, and survives clone and a Borsh round trip, over edge identities (64-char and implicit accounts, keys of all three curves differing in one byte) and 200k random pairs. Parametricity half: the Kani harnesses instantiate A/K with opaque newtypes (Acct, Key) implementing only Clone, PartialEq, Debug and Arbitrary, so a new trait bound in the core breaks the build"
status = "in-progress"

[assumptions.ASM-STAKE]
statement = "Account must hold storage_usage * 1e19 yocto; ~40 B overhead per record"
level = "med"
checked_by = ["RES-1"]
source = ["https://nomicon.io/DataStructures/Account.html", "https://nomicon.io/GenesisConfig/RuntimeConfig.html"]
arena_excludes = ["non_transfer_actions"]
observed = "RES-1 measured storage deltas (short names, ed25519 / 64-char names, secp256k1): add_agent 118/199 B, request_action(1 B) 144/225, request_action(2048 B) 2191/2272, approve 148/226, reject 83/161, revoke_key -53/-134, failures 0; 16 maximum requests lock 0.3506/0.3635 NEAR. LackBalanceForState when the balance is below storage_usage x 1e19 (RT-REVERT)"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv; every test also passed on the non-reproducible ffdbb5a7...0b90e1, 2026-10-15"
status = "in-progress"

[assumptions.ASM-LIMITS]
statement = "max_total_log_length 16384 B; 100 logs; 4 MiB return data; 300 TGas per call; view gas cap per node"
level = "med"
checked_by = ["RES-2", "RES-3"]
source = ["https://nomicon.io/GenesisConfig/VMConfig.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/MiscellaneousAPI.html"]
arena_excludes = ["function_calls_and_wasm"]
observed = "RES-3: get_approvals(0,100) over 100 maximum-size proofs returns about 1.30 MB (1,299,658-1,299,659 B across runs, < 4 MiB) as a view, and burns about 88.3-88.4 TGas as a transaction. RES-2 (sandbox cross-check): worst-case receipt logs 12,727-12,728 B (approval_requested) and 13,088 B (action_approved) of 16,384"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv; every test also passed on the non-reproducible ffdbb5a7...0b90e1, 2026-10-15"
status = "in-progress"

[assumptions.ASM-META]
statement = "NEP-366 (and NEP-518 eth-implicit) inner receipts carry the relayer as signer, so relayed calls fail IndirectCall"
level = "med"
checked_by = ["RT-METATX"]
source = ["https://github.com/near/NEPs/blob/master/neps/nep-0366.md", "https://github.com/near/NEPs/blob/master/neps/nep-0518.md", "https://nomicon.io/RuntimeSpec/Actions.html#delegateaction", "https://nomicon.io/architecture/how/meta-tx.html"]
arena_excludes = ["transactions", "signature_verification", "non_transfer_actions"]
observed = "RT-METATX: a NEP-366 delegate action (relayer signs, inner request_action signed by the agent's function-call key, and again by its full-access key) reaches C with signer = relayer and fails IndirectCall; the relayer's transaction itself succeeds; state unchanged. NEP-518 eth-implicit accounts not tested"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv; every test also passed on the non-reproducible ffdbb5a7...0b90e1, 2026-10-15"
status = "in-progress"

[assumptions.ASM-FCKEY]
statement = "Function-call keys restrict receiver and methods, cannot attach deposits, have an allowance, and cannot add keys"
level = "high"
checked_by = ["RT-FCKEY"]
source = ["https://nomicon.io/DataStructures/AccessKey.html#accesskeypermissionfunctioncall", "https://nomicon.io/RuntimeSpec/Transactions.html"]
arena_excludes = ["transactions", "signature_verification", "non_transfer_actions"]
observed = "RT-FCKEY: an agent key scoped to request_action calling approve or add_agent, and an approver key calling request_action, are rejected before execution with InvalidTxError InvalidAccessKeyError(MethodNameMismatch) (not a contract panic); a deposit through a function-call key is DepositWithFunctionCall; AddKey signed by a function-call key is RequiresFullAccess"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv; every test also passed on the non-reproducible ffdbb5a7...0b90e1, 2026-10-15"
status = "in-progress"

[assumptions.ASM-COMPILE]
statement = "rustc/LLVM/wasm-opt preserve core semantics host -> wasm32; overflow-checks on in release; the only on-chain usize use is action.len() > MAX_ACTION_LEN; cfg(feature=\"borsh\") gates only use/derive"
level = "n/a"
checked_by = ["RT-CODEHASH", "RT-TRACE"]
source = ["https://doc.rust-lang.org/cargo/reference/profiles.html#overflow-checks"]
observed = "RT-TRACE: 210 traces / 6,800 steps (prolog.txt 10x80, core-random.txt 200x30), every step equal to the host core and the trace file (results/RT-TRACE.json); RT-CODEHASH: on-chain code_hash = base58(sha256(wasm)) for the wasm under test. Ran on the reproducible build (sha256 3f48c2f2b121d359507ebc696c8a402e2ae7cba1c57552a5e18c49a65761bde9)"
observed_on = "near-sandbox 2.13.4 (protocol 86), reproducible cargo-near 0.22.0 wasm (sourcescan/cargo-near:0.22.0-rust-1.97.0) sha256 3f48c2f2...5761bde9, code_hash 5G334oPHzjDvPLXKUSstbaf3BzUPaj1sWZnDhy5Baauv; every test also passed on the non-reproducible ffdbb5a7...0b90e1, 2026-10-15"
status = "in-progress"

[assumptions.ASM-MODEL]
statement = "Kani-layer properties only: a core step on a state larger than the Kani bound behaves like one within it (strategy section 6.3). Properties on the verus layer (M5 path A) are proved on the real core at every size and do not rely on it"
level = "med"
checked_by = ["MC-2", "ST-8", "LINK", "LEAN-DELTA"]
observed = "L2 chain (strategy section 18.6): ST-8 shows the code's result and store calls equal ghost::expect / ghost::protocol at every store size; LINK shows expect/protocol equal the Lean cstep on all 736,500 footprint views of its bounded domain; LEAN-DELTA proves cstep refines the model's step on concrete stores of every size. The state bound is gone; what remains trusted is ASM-IDENT and the argument that LINK's domain covers every observable view"
status = "in-progress"

[assumptions.ASM-TLA-SCOPE]
statement = "TLA+ model bounds (strategy section 17.3): behaviours with more requests, keys or accounts than TLC and Apalache explore add no new violations. Accounts and keys are covered by ASM-IDENT parametricity; the request bound is a small-scope assumption. It backs no every-size claim: LEAN-IND, LEAN-STEP and LEAN-TR prove the safety properties and LEAN-LIVE proves TLA-LIVE-1/1s at every size (strategy sections 18.3, 18.7). It remains only as the scope of the TLC and Apalache rows themselves"
level = "med"
checked_by = ["TLA-IND", "REF-5", "LEAN-IND", "LEAN-LIVE"]
status = "unverified"

[assumptions.ASM-LEAN-TLA]
