  REF-1 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["plain"], harness = "h_ref_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS"], description = "Guard exactness (A1): the core's error equals the TLA+ error operator on alpha(pre); Ok exactly when the TLA+ action is enabled" }
  REF-2 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["plain"], harness = "h_ref_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS"], description = "Effect exactness (A2): on Ok, alpha(post) is the TLA+ action's post-state" }
  REF-3 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["plain"], harness = "h_ref_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS"], description = "Rejected calls stutter (A3): on Err, alpha(post) = alpha(pre)" }
  REF-4 = { status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["review"], harness = "h_ref_*", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-MODEL", "ASM-TOOLS"], description = "Time irrelevance (A7): tla.rs reads no BlockTime, so REF-1/2 hold for every block time; payload classes (A5) via h_ref_toolong" }
