  TLA-IND = { status = "in-progress", layer = "tla", evidence = "bounded-proof", cross = ["kani"], harness = "MC_Apalache", depends_on = ["core/src/lib.rs"], assumptions = ["ASM-IDENT", "ASM-TLA-SCOPE", "ASM-TOOLS", "ASM-SPEC"], description = "Apalache: Init => Inv, and Inv /\\ Next => Inv' /\\ StepProps from any state with <= 3 requests, integers unbounded, MaxPending scaled to 2: Inv and the step properties hold at every depth" }
