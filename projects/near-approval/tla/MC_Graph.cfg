\* MC-3 edge run (see MC_Graph.tla). Universe: owner + 2 accounts, 2 keys,
\* one storable payload, scaled MaxPending = 1 (C-5 records the real 16),
\* <= 2 requests, <= 3 registrations.
CONSTANTS
    Owner = o
    a1 = a1
    a2 = a2
    k1 = k1
    k2 = k2
    Accounts <- MCAccounts
    Keys <- MCKeys
    Payloads = {"x"}
    Empty = "EMPTY"
    TooLong = "TOOLONG"
    MaxPending = 1
    MaxReq = 2
    MaxReg = 3

SPECIFICATION GSpec
CHECK_DEADLOCK FALSE
