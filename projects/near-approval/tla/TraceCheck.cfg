\* REF-5. Constants match kani/src/ids.rs: owner Acct(0) is "o", accounts
\* Acct(1..3) are "a1".."a3", keys Key(0..3) are "k0".."k3", and the action
\* alphabet ACTIONS[0..2] is "p1".."p3" (codes from spec::act_code).
CONSTANTS
    Owner = "o"
    Accounts = {"o", "a1", "a2", "a3"}
    Keys = {"k0", "k1", "k2", "k3"}
    Payloads = {"p1", "p2", "p3"}
    Empty = "EMPTY"
    TooLong = "TOOLONG"
    MaxPending = 16

SPECIFICATION TSpec
PROPERTY Done
CHECK_DEADLOCK TRUE
