[package]
name = "shared-pool-near-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "near-sdk shell tests of pool-contract and pool-executor (shared-pool, near-approval strategy.md section 9 pattern)"

# Standalone: no parent workspace. Needs crates.io (or a warm ~/.cargo cache).
# Lockfile rule (near-approval strategy.md section 9): Cargo.lock was seeded
# from ../source-mirror/Cargo.lock; tests/lockfile.rs fails if a package
# present in both differs in version or checksum. Build with --locked.
[workspace]

[dependencies]

[dev-dependencies]
pool-core = { path = "../source-mirror/crates/core", features = ["serde", "borsh"] }
pool-contract = { path = "../source-mirror/crates/contract" }
pool-executor = { path = "../source-mirror/crates/executor" }
near-sdk = { version = "=5.29.1", default-features = false, features = ["unit-testing"] }
# The host-function declarations the mocked blockchain implements (near-sdk
# re-exports them only with its `unstable` feature). Same version as the pin.
near-sys = "=0.2.14"
# Runs the real wasm (built from the pin) against near-sdk's mocked VMLogic,
# for the generated wrappers that exist only on wasm32 (#[init], #[private],
# deposit checks, JSON arguments, #[callback_result]). Test-only: not in the
# contract's dependency graph.
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"] }

[profile.dev]
overflow-checks = true

# store_diff runs 80k steps; optimise dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 2

# The historical mutants s00a/s00b (run-mutants.sh) build the harness with
# --cfg nt_v100_contract / nt_v100_executor: v1.0.0's on_result signature and
# executor state. Ordinary builds set neither.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nt_v100_contract)", "cfg(nt_v100_executor)"] }
