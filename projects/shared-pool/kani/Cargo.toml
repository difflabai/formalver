[package]
name = "shared-pool-kani"
version = "0.1.0"
edition = "2021"
publish = false
description = "Kani harnesses (and their plain-mode twins) over the real pool-core"

# Standalone: no parent workspace includes this directory.
[workspace]

[dependencies]
# The real core from the pinned submodule, with no serde/borsh: zero
# dependencies, so what Kani checks is exactly the deployed decision logic.
pool-core = { path = "../source-mirror/crates/core", default-features = false }

# Plain mode runs with --release; keep overflow panics, as Kani checks them
# and the upstream release profile has them (ASM-COMPILE).
[profile.release]
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
