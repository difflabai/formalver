# ---------------------------------------------------------------------------
# strategy.md section 5.4: invariants. Section 5 lists tla first, so TLC
# (MC_Safety InvMC, and Inv on every TraceCheck state) is primary and these
# rows are in-progress; Kani is a cross layer here, and is pending as for the
# kani-primary rows (strategy.md section 12, "Kani pending"). Inv omits
# INV-HEALTHY (it enumerates subsets), so TraceCheck does not check that one.
# Lean proves the conjunction Inv at every size (inv_init, inv_step,
# reach_inv) and INV-HEALTHY as Live.lean healthy; Prolog checks each
# invariant on MC-1's graphs and the real core's trace states.
# ---------------------------------------------------------------------------
[modules.invariants]
source = "crates/core/src/lib.rs"
tla_model = "tla/Props.tla"
lean_model = "lean/PoolLean/Inv.lean"
prolog_requirements = "prolog/verification/props.pl"

