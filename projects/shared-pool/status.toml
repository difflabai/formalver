# ---------------------------------------------------------------------------
# Trust assumptions (strategy.md sections 3.3 and 5.14).
# level: high | med | low | policy (threat_model.pl assumption/3)
# ---------------------------------------------------------------------------

[assumptions.ASM-PRED]
statement = "The predecessor cannot be forged"
level = "high"
checked_by = ["RT-PRED", "SH-1"]
source = ["https://nomicon.io/RuntimeSpec/Receipts.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/ContextAPI.html", "spec:11"]
observed = "RT-PRED: an actor's relay.forward(submit) is attributed to the relay (the decision event's actor is the relay, Unauthorized, storage byte-identical); the same request sent directly is accepted; with the relay as a recipe's actor, a forward signed by an unrelated account is accepted as the relay's submit; dispatch, cancel, settle (even signed by the executor's key), set_paused and observe through the relay fail Unauthorized and write nothing. SH-1 (mocked runtime, host and both wasm builds): relayed calls are the relay's on every method"
observed_on = "near-sandbox 2.13.4 (near-workspaces 0.23.0), one shard; both builds of a4bb5c3 (upstream pool_contract sha256 8ddc9280...380f7c, cfg-near af617a8f...903c02), rustc 1.98.1, 2026-11-11"
status = "in-progress"

[assumptions.ASM-PRIVATE]
statement = "#[private] <=> predecessor = current account"
level = "high"
checked_by = ["RT-PRIVATE", "SH-2", "SH-3"]
source = ["https://docs.rs/near-sdk/5.29.1/near_sdk/", "spec:11", "api:7", "api:18"]
observed = "RT-PRIVATE: pool.new fails 'Method new is private' for the owner, the actor, an unrelated account and the executor, and through the relay when signed with the pool's own key; exec.new the same; a second new by the contract's own account fails 'The contract has already been initialized'; on_result fails 'Method on_result is private' for four foreign callers and the relay; on the pool's own key it passes the private check and fails reading the absent promise result; storage unchanged in every case. On the upstream build each failure is a bare unreachable trap (NT-F1 = SB-1)"
observed_on = "near-sandbox 2.13.4 (near-workspaces 0.23.0), one shard; both builds of a4bb5c3 (upstream pool_contract sha256 8ddc9280...380f7c, cfg-near af617a8f...903c02), rustc 1.98.1, 2026-11-11"
status = "in-progress"

[assumptions.ASM-CALLBACK]
statement = "The callback sees the executor's return or PromiseError"
level = "high"
checked_by = ["RT-CALLBACK", "SH-3"]
source = ["https://nomicon.io/RuntimeSpec/Components/BindingsSpec/PromisesAPI.html", "https://docs.rs/near-sdk/5.29.1/near_sdk/", "api:34"]
observed = "RT-CALLBACK: 'active' -> Active, reservation kept; 'cancelled' -> settle(executor, false) -> Cancelled, reservation released exactly; 'unknown' -> Unknown; execute panics -> the callback sees PromiseError -> Unknown, the dispatch transaction succeeds and the reservation is kept. SH-3 (mocked runtime): a promise result that is not a JSON string makes #[callback_result] panic, so the record stays where it was instead of Unknown (NT-F4)"
observed_on = "near-sandbox 2.13.4 (near-workspaces 0.23.0), one shard; both builds of a4bb5c3 (upstream pool_contract sha256 8ddc9280...380f7c, cfg-near af617a8f...903c02), rustc 1.98.1, 2026-11-11"
status = "in-progress"

[assumptions.ASM-ATOMIC]
statement = "A panicking receipt writes nothing"
level = "high"
checked_by = ["RT-REVERT", "RES-1"]
source = ["https://nomicon.io/RuntimeSpec/Receipts.html", "https://nomicon.io/RuntimeSpec/Actions.html"]
observed = "RT-REVERT: ten core errors through the wasm (Unauthorized, NotFound and InvalidState on dispatch and settle; Unauthorized and Pending on cancel; Unauthorized on set_paused; Pending on observe), Paused on dispatch, Bounds on observe (three inputs) and Arithmetic at version = u32::MAX (patched in) for set_paused and submit: each panics, the pool's raw storage is byte-identical and no event is emitted. RES-1 (res_1_min_prepaid_gas_and_executor_cap): the same for receipts that run out of prepaid gas (a host error, not a panic): 41 attempts at the maximum-size state (dispatch 40-69 Tgas, reconcile 40-45, the executor's finish 40-42) each fail 'Exceeded the prepaid gas.' in the first receipt, run no later receipt, log nothing, and leave the raw storage of the pool and the executor byte-identical"
observed_on = "near-sandbox 2.13.4 (near-workspaces 0.23.0), one shard; both builds of a4bb5c3 (upstream pool_contract sha256 8ddc9280...380f7c, cfg-near af617a8f...903c02), rustc 1.98.1, 2026-11-11 (RES-1 low-gas runs 2026-11-12)"
status = "in-progress"

[assumptions.ASM-INTERLEAVE]
statement = "Receipts can run between dispatch and on_result; ack and settle are independent model steps"
level = "med"
checked_by = ["RT-RACE"]
source = ["https://nomicon.io/RuntimeSpec/Scenarios/CrossContractCall.html", "https://nomicon.io/RuntimeSpec/Receipts.html"]
observed = "RT-RACE (one shard): a settle sent from inside execute always lands before the dispatch callback and the late 'active' ack is a no-op (version +2, not +3), for settle(true) and settle(false); the executor key's settle 0-400 ms after dispatch produced every serial order the core allows, the late-ack order included; the operator's finish cannot overtake the callback on one shard (a gap, not a failure). Multiple shards and congestion are not tested"
observed_on = "near-sandbox 2.13.4 (near-workspaces 0.23.0), one shard; both builds of a4bb5c3 (upstream pool_contract sha256 8ddc9280...380f7c, cfg-near af617a8f...903c02), rustc 1.98.1, 2026-11-11"
status = "in-progress"

# Untested: TLA+ and Lean allow any block time per call (a superset of
# monotone time); MC-1 assumes it, and so does LIVE-2, which cites MC-1.
[assumptions.ASM-TIME]
statement = "The block timestamp is monotone"
level = "high"
checked_by = []
source = ["https://nomicon.io/RuntimeSpec/Components/BindingsSpec/ContextAPI.html", "https://nomicon.io/ChainSpec/BlockProcessing.html"]
status = "unverified"

# F-2: the honest settle(false) is the report that fails. Carried by the rows
# that model an honest executor (LIVE-2, TLA-LIVE-F2, MC-1's release-blocked
# states) and, as T-UNKNOWN's residual, by its mitigations ASYNC-1,
# RT-CALLBACK, SH-3 and INV-LEDGER (threat_model.pl).
[assumptions.ASM-EXEC]
statement = "The executor is honest: settle(false) only on definitive nonexecution"
level = "policy"
checked_by = []
source = ["handoff:32", "api:14", "spec:50"]
status = "unverified"

# T-OBS's residual: carried by its mitigations OBS-1 and INV-WF
# (threat_model.pl). The in-bounds observations of LIVE-1 (B = 0),
# TLA-LIVE-1 and TLA-LIVE-F2 are premises of those claims, not this assumption:
# a true observation may be out of bounds (spec:54).
[assumptions.ASM-OWNER]
statement = "Observations are true"
level = "policy"
checked_by = []
source = ["handoff:32", "spec:54", "spec:56"]
status = "unverified"

# No deployment of this pin exists (strategy.md section 9.3). No property
# carries it: T-REDEPLOY's only mitigation is this assumption itself
# (threat_model.pl) and no section 5 row checks a deployment. It underlies
# every on-chain result, as ASM-TOOLS underlies every tool result.
[assumptions.ASM-DEPLOY]
statement = "No code replacement; the deployment lock is out of scope"
level = "policy"
checked_by = []
source = ["spec:56", "handoff:40"]
observed = "near-tests/wasm-surface.sh, both builds: SURF-1 passes (SH-11: pool_contract exports the 12 documented methods and contract_source_metadata, no upgrade or migrate method); SURF-2 fails as recorded: both contracts import 15 host functions that deploy, delete accounts, add keys, transfer, stake, or use gas keys or global contracts (NT-F3), so the import surface cannot rule out code replacement"
observed_on = "near-tests ./run.sh surface on a4bb5c3 (Plain and --cfg near builds), 2026-11-12"
status = "unverified"

# Controls, not checks of soundness: canaries, witnesses and mutants in every
# runner, the Lean axiom audit (lean/Audit.lean), extract.py --check.
[assumptions.ASM-TOOLS]
statement = "Scryer, TLC, Lean, Kani and the extractors are sound for what is used"
level = "med"
checked_by = []
status = "unverified"

# Checked only by [review] spec_reviewer, which is empty. The Prolog author
# had read the code (strategy.md section 8).
[assumptions.ASM-SPEC]
statement = "The specs, and the Prolog transcription of the docs, mean what we intend"
level = "low"
checked_by = []
status = "unverified"

[assumptions.ASM-MODEL]
statement = "The small scopes are representative: Kani's bounds, TLC's universes and 32-bit integers, MC-1's universes"
level = "med"
checked_by = ["LEAN-IND", "LEAN-STEP", "LEAN-LIVE1", "REF-5", "REF-5L", "MC-2"]
observed = "Lean proves Inv, the step properties and LIVE-1 for the model at every size (LEAN-IND, LEAN-STEP, LEAN-LIVE1). Traces 206 (values at +-1,000,000) and 207 (256 records) replay equal on TLC (REF-5), Lean (REF-5L) and Prolog (MC-2). Not covered: TLC's MaxVersion is 2^31 - 1 and it cannot represent large energies; Kani's bounds are not chosen yet"
status = "in-progress"

[assumptions.ASM-LEAN-TLA]
statement = "The Lean and TLA+ models transcribe the code"
level = "med"
checked_by = ["REF-5", "REF-5L", "MC-2", "C-2"]
observed = "212 real-core traces (8,804 calls) equal on TLC TraceCheck (REF-5, 9,016 of 9,016 states), the Lean machine (REF-5L) and Prolog step/4 (MC-2, 0 divergences); C-2: TLA+ GuardOrder = the code's guard order. Evidence, not a proof: the per-step Kani links REF-1..3 (strategy.md section 5.13) are pending and are not in checked_by until they have a result"
status = "in-progress"

[assumptions.ASM-COMPILE]
statement = "overflow-checks = true in the release profile"
level = "high"
checked_by = []
source = ["https://doc.rust-lang.org/cargo/reference/profiles.html#overflow-checks"]
observed = "tools/scripts/check-pin.sh shared-pool (release_overflow_checks = true): upstream Cargo.toml [profile.release] sets overflow-checks = true at a4bb5c3 (pin ok, 2026-11-12); the sandbox builds use that profile"
status = "in-progress"

# ---------------------------------------------------------------------------
# strategy.md section 5.1: configuration and numerics.
# Kani primary (section 5 lists kani first): unverified until the Kani layer
# lands. CFG-1 is proved for the Lean model without the string checks.
# ---------------------------------------------------------------------------
[modules.config_numerics]
source = "crates/core/src/lib.rs"
lean_model = "lean/PoolLean/Machine.lean"

  [modules.config_numerics.properties]
  CFG-1 = { id = "CFG-1", status = "unverified", layer = "kani", evidence = "bounded-proof", cross = ["lean", "tla"], harness = "kani: kani/src (strategy.md section 6, not landed); lean: Inv.lean inv_init; tla: TraceCheck.tla TInit (the configs the core accepted)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Pool::new is Ok iff validate is Ok, and the initial state satisfies INV. Lean proves Valid cfg => Inv (init cfg now), strings not modelled" }
  CFG-2 = { id = "CFG-2", status = "unverified", layer = "kani", evidence = "bounded-proof", cross = ["lean"], harness = "kani: kani/src (strategy.md section 6, not landed); lean: Machine.lean Valid (these checks as a definition; no theorem about the Rust)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "validate => references in range, vectors of length n, prerequisites strictly earlier and distinct, values bounded" }
  NUM-1 = { id = "NUM-1", status = "unverified", layer = "kani", evidence = "bounded-proof", cross = ["lean"], harness = "kani: kani/src (strategy.md section 6, not landed); lean: exact Int energy, overflow not modelled", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-COMPILE", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Valid config and bounded values => energy_terms and energy are Ok and exact" }
  NUM-2 = { id = "NUM-2", status = "unverified", layer = "kani", evidence = "bounded-proof", cross = ["lean"], harness = "kani: kani/src (strategy.md section 6, not landed); trace 206 (Arithmetic from add at 999,990 + 15 and from the envelope at 1,000,005) replayed by REF-5, REF-5L, MC-2 and SH-8; TLA+ mutants 23 and 24", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-COMPILE", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "add fails closed exactly when the exact result leaves +-1,000,000 (the boundary is tested by trace 206)" }
  ROB-1 = { id = "ROB-1", status = "unverified", layer = "kani", evidence = "bounded-proof", cross = [], harness = "kani: kani/src (strategy.md section 6, not landed); Lean's INV-WF shows every index the guards read is in range but does not model panics", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-COMPILE", "ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "No core panic from any INV state, for any arguments" }

# ---------------------------------------------------------------------------
# strategy.md section 5.2: transition contracts. Each gives the exact result
# (the first failing guard, in the code's order), the exact post-state and
# the frame. Kani primary: unverified until the Kani layer lands. TLA+, Lean
# and Prolog check them now (proved for the model where Lean has a theorem;
# all replay the 212 real-core traces).
# ---------------------------------------------------------------------------
[modules.transitions]
source = "crates/core/src/lib.rs"
tla_model = "tla/SharedPool.tla"
lean_model = "lean/PoolLean/Machine.lean"
prolog_requirements = "prolog/model/pool_machine.pl"

  [modules.transitions.properties]
