# ---------------------------------------------------------------------------
# strategy.md section 5.2: transition contracts. Each gives the exact result
# (the first failing guard, in the code's order), the exact post-state and
# the frame. Kani primary: bounded proofs on the real core against the
# executable spec (kani/src/spec.rs), from 2-record INV states (`kani_bound`).
# TLA+, Lean and Prolog check them too (proved for the model where Lean has
# a theorem; all replay the 212 real-core traces).
# ---------------------------------------------------------------------------
