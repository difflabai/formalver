# Status values, evidence vocabulary and ceilings: projects/near-approval/strategy.md section 12.
# Status values: unverified | in-progress | verified | verified-with-assumptions | stale
# Project rules: projects/shared-pool/strategy.md section 12. In short:
#   - Nothing here goes past in-progress: [review] spec_reviewer is empty
#     (and Kani's ceiling is verified-with-assumptions in any case).
#   - One module per strategy.md section 5 subsection (5.1 .. 5.13); the
#     properties are exactly section 5's non-ASM rows (103), the
#     [assumptions.<ID>] tables its ASM-* rows (15). IDs equal
#     prolog/requirements/traceability.pl's property/3 (118).
#   - v1.1.0 re-verification (pin 57b3f02). A row is `in-progress` once its
#     primary layer re-checked it at the pin: TLA+ (TLA-EXEC included),
#     Lean, Prolog, conformance, near-tests and the sandbox have (W3-W10).
#     Kani has not yet: the rows whose primary layer is kani keep their
#     status (`stale`, or `unverified` if new), and on every row the `kani`
#     segment of `harness` ("kani (planned)" on a new row), `kani_bound`
#     and `kani_run` record the v1.0.0 Kani result at a4bb5c3 (a072a2d).
#     The rest of a row (description, closes, the other layers' harness
#     text, observed) is v1.1.0's; strategy.md section 5 has the v1.1.0
#     statement. TLA-IND is `unverified` (OQ-7), as at v1.0.0; ASM-MODEL,
#     ASM-LEAN-TLA and ASM-TOOLS stay `stale` until Kani's v1.1.0 result.
#     The assumptions' `source` doc cites are v1.1.0 lines.
#   - `layer` is the first layer of the row's Layer(s) cell (near-tests maps
#     to unit, difftest or wasm-check by the file that tags it); `cross` holds
#     the row's other layers plus any other layer whose files carry the ID's
#     PROP tag. Other evidence the row cites is named in `harness`.
#   - Kani-primary properties carry the Kani layer's result (strategy.md
#     section 6, kani/RESULTS.md): in-progress, evidence bounded-proof, the
#     harnesses first in `harness`, the bound in `kani_bound`, and in
#     `kani_run` whether CI runs each harness or the local record holds it.
#     Their other layers' results stay in `cross` and `harness`. What Kani
#     does not establish (LIVE-2; F-2 and F-5 reached from Pool::new) is not
#     claimed for Kani.
# Property keys (near-approval strategy.md section 12): id, status, layer,
#   evidence (the TARGET evidence), cross, harness (where the `PROP:` tag or
#   the ID sits), depends_on (relative to upstream_path, here the repository
#   root), assumptions (ASM IDs; strategy.md section 12 says which),
#   description; optional blocked_by (an OQ of strategy.md section 16),
#   closes (the [findings.<ID>] tables at the end of this file that the
#   row's v1.1.0 result closes: a fix's regression property, the killer of
#   its fix-revert mutant, or an inverted witness) and finding (an open
#   finding the row's section 5 Statement or Status cell names; none at
#   v1.1.0). status-lint checks both against [findings]: each `closes`
#   entry is a finding whose closed_by lists the row, and back, and a
#   `finding` names an open one.
#   Optional observed / observed_on (as for assumptions): what a test in
#   `cross` saw (RD-PREVIEW, RD-BEST: the COV-2 differential). Optional
#   kani_bound, on every row with a Kani result (primary or cross): the
#   bounds the bounded proof holds within (kani/RESULTS.md, Bounds); Kani
#   0.68.0, CBMC 6.11.0, runs of 2026-11-12 and 2026-11-13 on a4bb5c3.
#   kani_run, on the same rows: where each of the row's Kani harnesses is
#   checked now (strategy.md sections 6 and 14). "CI kani job": the kani job
#   of .github/workflows/shared-pool.yml runs it whenever a change reaches
#   the Kani layer, on GitHub's hosted runner unless KANI_RUNNER or CI_RUNNER
#   names another (the 53 harnesses that peaked at 13 GB or less in
#   kani/RESULTS.md). "local record": it peaked above 13 GB and does not
#   fit that runner, so it was run on a 64 GB Apple M1 Max at commit 89f99d6
#   and recorded in kani/local (kani/RESULTS.md, Local record). CI's
#   kani-record job checks that record (fingerprint of the Kani inputs = the
#   commit's, every result as required) and does not run the harness again,
#   unless KANI_RUNNER names a runner large enough (the kani-large job).
# Assumption keys: statement (strategy.md section 5.14), level
#   (threat_model.pl assumption/3), checked_by (properties only: the union of
#   assumption_checked_by/2 and section 5.14's Evidence cell), status, and,
#   where there is one, source: the NEAR pages near-approval read against its
#   [protocol_reference], or the upstream docs at the pin as spec:<line>,
#   api:<line>, handoff:<line>. observed / observed_on record what a check
#   saw, including checks that are not properties (check-pin.sh, the wasm
#   surface).

[review]
spec_reviewer = ""          # empty until a named human who did not write pool-core signs off
