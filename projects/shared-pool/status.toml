# ---------------------------------------------------------------------------
# strategy.md section 5.7: contract shell, mocked runtime (near-tests/), on
# the host and on two wasm builds. shell.rs is `unit`, store_diff.rs and
# traces.rs are `difftest`, wasm-surface.sh is `wasm-check`.
# ---------------------------------------------------------------------------
[modules.contract_shell]
source = "crates/contract/src/lib.rs"
prolog_requirements = "prolog/requirements/pool_req.pl"

  [modules.contract_shell.properties]
  SH-1 = { id = "SH-1", status = "in-progress", layer = "unit", evidence = "test", cross = ["difftest"], harness = "near-tests/tests/shell.rs sh1_caller_is_the_predecessor_not_the_signer, sh1_now_is_the_block_timestamp_in_whole_seconds; tests/store_diff.rs (15% relayed calls); mutants m02, m10", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-PRED"], description = "caller = predecessor; now = block time in whole seconds" }
  SH-2 = { id = "SH-2", status = "in-progress", layer = "unit", evidence = "test", cross = [], harness = "near-tests/tests/shell.rs sh2_new_is_private_and_initialises_once; mutant m09", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-PRIVATE"], description = "new is private and initializes once" }
  # NT-F4: a promise result that is not a JSON string makes
  # #[callback_result] panic; the record stays where it was, not Unknown.
  SH-3 = { id = "SH-3", status = "in-progress", layer = "unit", evidence = "test", cross = ["difftest"], harness = "near-tests/tests/shell.rs sh3_on_result_is_private, sh3_on_result_maps_the_status_string, sh3_non_string_promise_results_fail_the_callback (NT-F4); tests/store_diff.rs, tests/traces.rs; mutants m01, m03, m04, m08, m14", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-PRIVATE", "ASM-CALLBACK", "ASM-EXEC"], finding = "NT-F4", description = "on_result is private, and maps the status string as documented. Fails for a promise result that is not a JSON string: #[callback_result] panics and the record stays where it was instead of becoming Unknown, against api:34 (NT-F4)" }
  SH-4 = { id = "SH-4", status = "in-progress", layer = "unit", evidence = "test", cross = ["difftest"], harness = "near-tests/tests/shell.rs sh4_rejected_submit_returns_the_decision_and_writes_nothing (15 rejection cases, Full and Arithmetic included); tests/store_diff.rs, tests/traces.rs; mutant m13", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = [], description = "submit = core preview then submit; a rejected submit writes nothing" }
  # NT-F1: holds on the --cfg near build (how cargo-near builds; the scope of
  # strategy.md section 1) and is FALSE on the documented build
  # (scripts/build.sh), where every failure is a bare unreachable trap.
  SH-5 = { id = "SH-5", status = "in-progress", layer = "unit", evidence = "test", cross = ["difftest", "wasm-check"], harness = "near-tests/tests/shell.rs sh5_core_errors_are_panics_with_the_error_string, nt_f1_upstream_build_drops_every_panic_message; tests/store_diff.rs, tests/traces.rs; near-tests/wasm-surface.sh SURF-1 (only the --cfg near build imports panic_utf8)", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-ATOMIC"], finding = "NT-F1", description = "A core Err panics with exactly the error string and changes nothing. Holds on the host and the --cfg near wasm. Fails on the documented build (scripts/build.sh): every failure is a bare unreachable trap with no message; state still reverts (NT-F1)" }
  SH-6 = { id = "SH-6", status = "in-progress", layer = "unit", evidence = "test", cross = ["difftest"], harness = "near-tests/tests/shell.rs sh6_dispatch_promise_shape; tests/store_diff.rs; tests/executor.rs ex5_end_to_end_normal_reject_unknown_panic; mutant m11", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = [], description = "dispatch promise shape: execute{id,recipe,units} to the executor, 30 Tgas, then on_result" }
  SH-7 = { id = "SH-7", status = "in-progress", layer = "unit", evidence = "test", cross = ["difftest"], harness = "near-tests/tests/shell.rs sh7_reconcile_guard_and_promise_shape; tests/store_diff.rs; tests/executor.rs ex5_end_to_end_normal_reject_unknown_panic; mutants m05, m15", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = [], description = "reconcile guard and promise shape: status{id} 10 Tgas, then on_result, by anyone, no state write" }
  SH-8 = { id = "SH-8", status = "in-progress", layer = "difftest", evidence = "test", cross = [], harness = "near-tests/tests/store_diff.rs sh8_store_diff_host (80,000 calls), sh8_store_diff_wasm (12,000 calls per build); tests/traces.rs conformance_traces_through_the_shell (8,804 calls x 3 paths)", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = [], description = "Borsh state round trip: the shell equals the core, with a reload before every call" }
  SH-9 = { id = "SH-9", status = "in-progress", layer = "unit", evidence = "test", cross = ["difftest"], harness = "near-tests/tests/shell.rs sh9_views_and_paging_at_256_records; tests/store_diff.rs (views every call); mutant m06", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = [], description = "Views: get_pool, get_commitments pages of at most 50" }
  # NT-F2: reconcile is a &self method, so near-sdk generates no deposit
  # check; it accepts and keeps an attached deposit (api:3 says every
  # mutating method is nonpayable).
  SH-10 = { id = "SH-10", status = "in-progress", layer = "unit", evidence = "test", cross = [], harness = "near-tests/tests/shell.rs sh10_mutating_methods_reject_attached_deposits, nt_f2_reconcile_accepts_and_keeps_an_attached_deposit (NT-F2); mutant m12", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = [], finding = "NT-F2", description = "Nonpayable methods reject deposits: new, submit, dispatch, settle, cancel, set_paused, observe and on_result do. Fails against api:3 (all mutating methods are nonpayable) for reconcile, a &self method with no deposit check, which accepts and keeps an attached deposit (NT-F2)" }
  # NT-F3: the exports are pinned, but both wasm files still import
  # transfer, deploy and add-key host functions (SURF-2 expected-fail), so
  # S-NOADMIN's funds-transfer and plugin clauses rest on source review.
  SH-11 = { id = "SH-11", status = "in-progress", layer = "wasm-check", evidence = "check", cross = [], harness = "near-tests/wasm-surface.sh SURF-1 vs wasm-surface.expected (Plain and --cfg near builds; near-tests/run.sh surface)", depends_on = ["crates/contract/src/lib.rs", "crates/executor/src/lib.rs", "Cargo.lock"], assumptions = [], finding = "NT-F3", description = "Export surface, both builds: pool_contract exports exactly the 12 documented methods plus contract_source_metadata and memory, and pool_executor its 7 methods plus the same two; no upgrade, migrate or reset export. The imports do not exclude transfer, deploy or add-key actions (NT-F3: source review only)" }

