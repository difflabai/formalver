level = "med"
checked_by = []
observed = "Kani: h_canary FAILS on its own assertion only, 164 of 164 covers SATISFIED, 30 of 30 must-kill mutants killed and the equivalent mutant 20 survives (kani/RESULTS.md). In CI the kani job reruns h_canary with the 52 other harnesses that fit the hosted runner, and the covers job checks the 164 covers over those and the local record's 36 harnesses (kani/local, run at 89f99d6; the kani-record job checks it); the mutants job reruns all 31 in plain mode on every run, kani-mutants (manual runs) under Kani the 15 sized to fit the hosted runner, and the local record holds the other 16 (plain and Kani). Two Kani 0.68.0 soundness hazards were found and worked around: a written static sharing storage with an equal constant, and a reference into a local array of structs at an unfolded index read unconstrained values (Tool issues)"
observed_on = "Kani 0.68.0, CBMC 6.11.0, 2026-11-12 and 2026-11-13; the local record's run at 89f99d6 from 2026-11-13T22:44:37Z (kani/local/provenance.txt)"
