lean_model = "lean/PoolLean/Inv.lean"
prolog_requirements = "prolog/verification/props.pl"

  [modules.invariants.properties]
  INV-WF = { id = "INV-WF", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-WF (InvMC in MC_Safety.cfg, Inv on every TraceCheck state); lean: Inv.lean reach_inv; prolog: verification/props.pl via tests/test_mc1.pl (MC-1) and tests/test_mc2.pl (MC-2); kani: h_step_<op>_inv (2 records), h_step_<op>_inv_0, _inv_1 and _inv_3 (7 kinds each), h_init_inv, h_init_inv_2 (the induction); h_bmc_from_init_po, h_bmc_from_init_s_<op> (2-operation traces from Pool::new)", kani_bound = "induction over the step shape and domains: INV in the initial pool (shapes 1/1/2 and 2/2/2) and preserved, with the ghost update, by every step of every kind from INV states with exactly 0, 1, 2 and 3 records, so in every state reachable from Pool::new with at most 3 records; 4 or more records not covered; values Anchored(4), deltas -3..3", kani_run = "CI kani job: h_step_<op>_inv (dispatch, ack, pause, observe), h_step_<op>_inv_0 (dispatch, ack, cancel, settle, pause, observe), h_step_<op>_inv_1 (dispatch, ack, cancel, pause, observe), h_step_<op>_inv_3 (dispatch, ack, pause), h_init_inv, h_init_inv_2; local record: h_step_<op>_inv (submit, cancel, settle), h_step_submit_inv_0, h_step_submit_inv_1, h_step_settle_inv_1, h_step_<op>_inv_3 (submit, cancel, settle, observe), h_bmc_from_init_po, h_bmc_from_init_s_<op> (7)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-OWNER", "ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "Values have length n and are bounded; records[j].id = j; recipe in range; 1 <= units <= max_units; at most 256 records; config never changes" }
  INV-LEDGER = { id = "INV-LEDGER", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-LEDGER (InvMC, TraceCheck); lean: Inv.lean reach_inv; prolog: verification/props.pl via tests/test_mc1.pl and tests/test_mc2.pl; kani: h_step_<op>_inv (2 records), h_step_<op>_inv_0, _inv_1 and _inv_3 (7 kinds each), h_init_inv, h_init_inv_2 (the induction); h_bmc_from_init_po, h_bmc_from_init_s_<op> (2-operation traces from Pool::new)", kani_bound = "induction over the step shape and domains: INV in the initial pool (shapes 1/1/2 and 2/2/2) and preserved, with the ghost update, by every step of every kind from INV states with exactly 0, 1, 2 and 3 records, so in every state reachable from Pool::new with at most 3 records; 4 or more records not covered; values Anchored(4), deltas -3..3", kani_run = "CI kani job: h_step_<op>_inv (dispatch, ack, pause, observe), h_step_<op>_inv_0 (dispatch, ack, cancel, settle, pause, observe), h_step_<op>_inv_1 (dispatch, ack, cancel, pause, observe), h_step_<op>_inv_3 (dispatch, ack, pause), h_init_inv, h_init_inv_2; local record: h_step_<op>_inv (submit, cancel, settle), h_step_submit_inv_0, h_step_submit_inv_1, h_step_settle_inv_1, h_step_<op>_inv_3 (submit, cancel, settle, observe), h_bmc_from_init_po, h_bmc_from_init_s_<op> (7)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-EXEC", "ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "values = base + sum of reservations of records since k0 not Cancelled + sum of completions of Completed records since k0" }
  INV-HARD = { id = "INV-HARD", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-HARD (InvMC, TraceCheck); lean: Inv.lean reach_inv; prolog: verification/props.pl via tests/test_mc1.pl and tests/test_mc2.pl; kani: h_step_<op>_inv (2 records), h_step_<op>_inv_0, _inv_1 and _inv_3 (7 kinds each), h_init_inv, h_init_inv_2 (the induction); h_bmc_from_init_po, h_bmc_from_init_s_<op> (2-operation traces from Pool::new)", kani_bound = "induction over the step shape and domains: INV in the initial pool (shapes 1/1/2 and 2/2/2) and preserved, with the ghost update, by every step of every kind from INV states with exactly 0, 1, 2 and 3 records, so in every state reachable from Pool::new with at most 3 records; 4 or more records not covered; values Anchored(4), deltas -3..3", kani_run = "CI kani job: h_step_<op>_inv (dispatch, ack, pause, observe), h_step_<op>_inv_0 (dispatch, ack, cancel, settle, pause, observe), h_step_<op>_inv_1 (dispatch, ack, cancel, pause, observe), h_step_<op>_inv_3 (dispatch, ack, pause), h_init_inv, h_init_inv_2; local record: h_step_<op>_inv (submit, cancel, settle), h_step_submit_inv_0, h_step_submit_inv_1, h_step_settle_inv_1, h_step_<op>_inv_3 (submit, cancel, settle, observe), h_bmc_from_init_po, h_bmc_from_init_s_<op> (7)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "The envelope over the open records is computable and EV_i <= B_i" }
  INV-HEALTHY = { id = "INV-HEALTHY", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-HEALTHY (in InvMC, checked by MC_Safety and the MC_Liveness configs; TraceCheck checks Inv, which omits it); lean: Live.lean healthy; prolog: verification/props.pl via tests/test_mc1.pl and tests/test_mc2.pl; kani: h_step_<op>_inv (2 records), h_step_<op>_inv_0, _inv_1 and _inv_3 (7 kinds each), h_init_inv, h_init_inv_2 (the induction); h_bmc_from_init_po, h_bmc_from_init_s_<op> (2-operation traces from Pool::new)", kani_bound = "induction over the step shape and domains: INV in the initial pool (shapes 1/1/2 and 2/2/2) and preserved, with the ghost update, by every step of every kind from INV states with exactly 0, 1, 2 and 3 records, so in every state reachable from Pool::new with at most 3 records; 4 or more records not covered; values Anchored(4), deltas -3..3", kani_run = "CI kani job: h_step_<op>_inv (dispatch, ack, pause, observe), h_step_<op>_inv_0 (dispatch, ack, cancel, settle, pause, observe), h_step_<op>_inv_1 (dispatch, ack, cancel, pause, observe), h_step_<op>_inv_3 (dispatch, ack, pause), h_init_inv, h_init_inv_2; local record: h_step_<op>_inv (submit, cancel, settle), h_step_submit_inv_0, h_step_submit_inv_1, h_step_settle_inv_1, h_step_<op>_inv_3 (submit, cancel, settle, observe), h_bmc_from_init_po, h_bmc_from_init_s_<op> (7)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "B = 0 => every subset of open completions lands in bounds" }
