  EX-2 = { id = "EX-2", status = "in-progress", layer = "unit", evidence = "test", cross = [], harness = "near-tests/tests/executor.rs ex2_payload_binding_and_dedupe; mutants m16, m21", depends_on = ["crates/executor/src/lib.rs", "Cargo.lock"], assumptions = [], description = "Payload binding and dedupe: a replay returns the recorded status; another payload fails" }
  EX-3 = { id = "EX-3", status = "in-progress", layer = "unit", evidence = "test", cross = [], harness = "near-tests/tests/executor.rs ex3_only_the_operator_attests; mutant m18", depends_on = ["crates/executor/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-PRED"], description = "Only the operator finishes, confirms or sets the mode" }
  EX-4 = { id = "EX-4", status = "in-progress", layer = "unit", evidence = "test", cross = [], harness = "near-tests/tests/executor.rs ex4_terminal_conflict_rejected; tests/wedge.rs f1_wedge_end_to_end_with_the_executor; mutant m19", depends_on = ["crates/executor/src/lib.rs", "Cargo.lock"], assumptions = [], description = "A conflicting terminal outcome is rejected" }
  EX-5 = { id = "EX-5", status = "in-progress", layer = "unit", evidence = "test", cross = [], harness = "near-tests/tests/executor.rs ex5_notify_calls_lock_settle, ex5_end_to_end_normal_reject_unknown_panic; tests/wedge.rs f1_wedge_end_to_end_with_the_executor; mutant m20", depends_on = ["crates/executor/src/lib.rs", "Cargo.lock"], assumptions = [], description = "Notify calls lock.settle{id,completed}, 40 Tgas" }

# ---------------------------------------------------------------------------
# strategy.md section 5.9: runtime (sandbox/, real wasm on near-sandbox
# 2.13.4, one shard). Every row ran on both builds (upstream and --cfg near),
# with a host pool_core oracle compared after every step.
# ---------------------------------------------------------------------------
[modules.runtime]
source = "crates/contract/src/lib.rs"
prolog_requirements = "prolog/requirements/threat_model.pl"

  [modules.runtime.properties]
  RT-PRED = { id = "RT-PRED", status = "in-progress", layer = "sandbox", evidence = "test", cross = [], harness = "sandbox/tests/runtime.rs::rt_pred_relay_is_the_caller", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-PRED"], description = "Calls through a relay are attributed to the relay" }
  RT-PRIVATE = { id = "RT-PRIVATE", status = "in-progress", layer = "sandbox", evidence = "test", cross = [], harness = "sandbox/tests/runtime.rs::rt_private_new_and_on_result", depends_on = ["crates/contract/src/lib.rs", "crates/executor/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-PRIVATE"], description = "new and on_result reject foreign callers" }
  RT-CALLBACK = { id = "RT-CALLBACK", status = "in-progress", layer = "sandbox", evidence = "test", cross = [], harness = "sandbox/tests/runtime.rs::rt_callback_status_mapping", depends_on = ["crates/contract/src/lib.rs", "crates/executor/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-CALLBACK", "ASM-EXEC"], description = "execute panic -> Unknown; 'cancelled' -> Cancelled and released; 'active' -> Active" }
  RT-REVERT = { id = "RT-REVERT", status = "in-progress", layer = "sandbox", evidence = "test", cross = [], harness = "sandbox/tests/runtime.rs::rt_revert_core_errors_write_nothing", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-ATOMIC"], description = "A core error leaves storage byte-identical and emits nothing" }
  RT-RACE = { id = "RT-RACE", status = "in-progress", layer = "sandbox", evidence = "test", cross = ["unit"], harness = "sandbox/tests/runtime.rs::rt_race_settle_before_callback, rt_race_executor_key_settles_while_callback_in_flight, rt_race_operator_finish_vs_callback; near-tests/tests/executor.rs ex5_settle_before_callback_is_absorbed (pool side)", depends_on = ["crates/contract/src/lib.rs", "crates/executor/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-INTERLEAVE"], description = "Settle before the execute callback; the late ack is ignored. Tested on one shard; the operator's finish cannot overtake the callback there" }
  # Finding witness: passes while F-1 reproduces on the wasm. When upstream
  # fixes F-1 it fails as stale; invert it, do not delete it (section 12).
  RT-WEDGE = { id = "RT-WEDGE", status = "in-progress", layer = "sandbox", evidence = "test", cross = ["unit"], harness = "sandbox/tests/runtime.rs::rt_wedge_f1_end_to_end; near-tests/tests/wedge.rs f1_wedge_end_to_end_with_the_executor (mocked runtime)", depends_on = ["crates/contract/src/lib.rs", "crates/executor/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = [], finding = "F-1", description = "F-1 end to end: the executor commits 'completed', its settle(true) fails Bounds and the record stays Active; finish(cancelled), confirm_not_executed, both settles, cancel and observe all fail; after 200 more blocks observe and settle still fail" }
  RES-1 = { id = "RES-1", status = "in-progress", layer = "sandbox", evidence = "test", cross = [], harness = "sandbox/tests/resources.rs::res_1_gas_at_max_state, res_1_min_prepaid_gas_and_executor_cap", depends_on = ["crates/contract/src/lib.rs", "crates/executor/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-ATOMIC"], description = "Gas at the maximum-size state stays under 300 Tgas (worst pool receipt 12.56 Tgas: submit #256). At that state the least whole-Tgas prepaid gas that succeeds is 70 for dispatch, 46 for reconcile and 43 for the executor's finish; every amount from 40 Tgas up to one below fails out of gas and changes nothing. With the executor at its 256-job cap (every record dispatched through the pool): execute #256 2.52 Tgas of 30, status 1.77 of 10, finish 2.87" }

