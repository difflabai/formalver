  [modules.contract_shell.properties]
  SH-1 = { id = "SH-1", status = "in-progress", layer = "unit", evidence = "test", cross = ["difftest"], harness = "near-tests/tests/shell.rs sh1_caller_is_the_predecessor_not_the_signer, sh1_now_is_the_block_timestamp_in_whole_seconds; tests/store_diff.rs (15% relayed calls); mutants s02, s10", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-PRED"], description = "caller = predecessor; now = block time in whole seconds" }
