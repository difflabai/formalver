  ADM-2 = { id = "ADM-2", status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["tla", "lean", "prolog"], harness = "kani: h_step_submit_tx (against the spec's exact energy); lean: StepProps.lean stepProps; tla: Props.tla ADM-2 in StepProperty; prolog: tests/test_mc2.pl (MC-2), tests/test_model.pl", kani_bound = "step shape (1 metric, 1 term, 2 recipes), INV pre-state with exactly 2 records, values Anchored(4) (-1e6, 0, 1e6, each +-4), deltas -3..3, max_units 1..3, weights 1, 2 or 1000, accounts o_, a1, x1, z_ in every role; time, version and expiry arguments free; recipe, units and ids narrow where they are only compared", kani_run = "local record: h_step_submit_tx", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "Submit Ok in a violating state => energy(post + completion) < energy(pre)" }
