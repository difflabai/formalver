# ---------------------------------------------------------------------------
# strategy.md section 5.3: step properties. Kani primary: unverified until
# the Kani layer lands. Proved for the Lean model at every size,
# model-checked by TLC (StepProperty) and checked on every replayed call of
# the real core's traces (MC-2).
# ---------------------------------------------------------------------------
