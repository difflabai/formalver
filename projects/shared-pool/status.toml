[modules.reads]
source = "crates/core/src/lib.rs"
prolog_requirements = "prolog/model/pool_machine.pl"

  [modules.reads.properties]
  RD-PREVIEW = { id = "RD-PREVIEW", status = "stale", layer = "kani", evidence = "bounded-proof", cross = ["difftest", "unit", "prolog"], harness = "kani: h_preview (allowed iff the spec's candidate is Ok; reason, candidate values, before, after and the term strings; no mutation), h_preview_post (allowed and version < u32::MAX => submit Ok with the previewed candidate); near-tests: tests/store_diff.rs (preview view every call), tests/shell.rs sh9_views_and_paging_by_id_through_the_window (the shell's preview equals the core's); prolog: tests/test_reads.pl via verification/reads.pl (COV-2 differential: the real core's preview in conformance/traces/reads.txt, written by conformance/src/main.rs --reads-out, against the model's preview_allowed, first failing submit guard, candidate and energies) and tests/test_model.pl preview_allowed over a request grid (model); conformance: src/main.rs also runs submit on a copy of the pool for every recorded preview and fails on a disagreement", kani_bound = "step shape (1 metric, 1 term, 2 recipes), INV pre-state with exactly 2 records, values Anchored(4) (-1e6, 0, 1e6, each +-4), deltas -3..3, max_units 1..3, weights 1, 2 or 1000, accounts o_, a1, x1, z_ in every role; time, version and expiry arguments free; recipe, units and ids narrow where they are only compared", kani_run = "local record: h_preview, h_preview_post", observed = "COV-2: 39,627 requests at 1,300 states of the 216 conformance traces (12 at VERSION_CAP or u32::MAX): 0 divergences between the real core's preview (allowed, reason, candidate, before, after) and the Prolog model. 1,785 allowed; 37,842 rejected (paused 4,919, stale 1,998, expired 3,384, snapshot_expired 815, full 26, invalid_recipe 2,202, unauthorized 5,505, invalid_units 13,484, prerequisite 642, arithmetic 61, bounds 3,712, energy 1,094). At the 12 cap states no request is allowed and 30 are refused Arithmetic. submit on a copy agrees with every preview. Model mutant m19 (preview ignores paused) is caught by test_reads only; m28 (submit, and so preview, not gated by VERSION_CAP) gives 180 divergences at the cap states. Reads mutant d02 (the core's preview allows a Paused request) stops the generator: preview and submit disagree on 4,919 requests. Testing, not proof. Not covered: other states and requests, terms_before/terms_after", observed_on = "conformance generator and Scryer Prolog 0.10.0 on 57b3f02; reads.txt sha256 9733bc8f...47700103; prolog/run.sh at a7781c7 and again at 5cf571e, 2026-11-14", depends_on = ["crates/core/src/lib.rs", "crates/contract/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "preview.allowed <=> candidate Ok <=> submit Ok (the version cap is candidate's last check, so no version premise); no mutation, no panic" }
  RD-BEST = { id = "RD-BEST", status = "stale", layer = "kani", evidence = "bounded-proof", cross = ["prolog"], harness = "kani: h_best with h_preview, h_step_submit_tx, h_step_submit_post and h_energy: a composition (kani/RESULTS.md deviation 24); prolog: tests/test_reads.pl via verification/reads.pl (COV-2 differential: the real core's best_quantity in conformance/traces/reads.txt against the model's best_quantity/4) and tests/test_model.pl best_quantity against brute force on small cases (model)", kani_bound = "h_best: the step configuration with no record, any submit request of the step domain with units <= 7, candidate stubbed by a free Ok or Err per quantity and energy by a free result per call; the min(units, 100) cap and the real candidate and energy (units <= 3) plain mode only", kani_run = "CI kani job: h_best; local record: h_preview, h_step_submit_tx, h_step_submit_post, h_energy", observed = "COV-2: the same 39,627 requests: 0 divergences between the real core's best_quantity and the model's. 6,233 some, 33,394 none, 1,912 above MAX_UNITS. Reads mutant d01 (the core's ties broken to the smaller units, reads.txt regenerated) gives 1,645 divergences; model mutants m18 (same edit) and m20 (request version ignored) are caught, m20 by test_reads only, and m28 at the 12 cap states. Testing, not proof. Not covered: other states and requests", observed_on = "conformance generator and Scryer Prolog 0.10.0 on 57b3f02; reads.txt sha256 9733bc8f...47700103; prolog/run.sh at a7781c7 and again at 5cf571e, 2026-11-14", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "best_quantity is sound and minimal as documented" }

