  TX-ACK = { id = "TX-ACK", status = "unverified", layer = "kani", evidence = "bounded-proof", cross = ["tla", "lean", "prolog"], harness = "kani: kani/src (strategy.md section 6, not landed); tla: TraceCheck (REF-5); lean: REF-5L replay; prolog: tests/test_mc2.pl, tests/test_model.pl, C-2 guard order, C-3 lifecycle", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "acknowledge: exact result in guard order, exact post-state, frame (the no-op ack keeps the version: div-ack-noop-version)" }
