# ---------------------------------------------------------------------------
# Trust assumptions (strategy.md sections 3.3 and 5.14).
# level: high | med | low | policy (threat_model.pl assumption/3)
# ---------------------------------------------------------------------------

[assumptions.ASM-PRED]
statement = "The predecessor cannot be forged"
level = "high"
checked_by = ["RT-PRED", "SH-1"]
source = ["https://nomicon.io/RuntimeSpec/Receipts.html", "https://nomicon.io/RuntimeSpec/Components/BindingsSpec/ContextAPI.html", "spec:13"]
observed = "RT-PRED: an actor's relay.forward(submit) is attributed to the relay (the decision event's actor is the relay, Unauthorized, storage byte-identical); the same request sent directly is accepted; with the relay as a recipe's actor, a forward signed by an unrelated account is accepted as the relay's submit; dispatch, cancel, settle (even signed by the executor's key), set_paused and observe through the relay fail Unauthorized and write nothing. SH-1 (mocked runtime, host path and the documented build): the caller is the predecessor, not the signer (near-tests/tests/shell.rs sh1_caller_is_the_predecessor_not_the_signer; tests/store_diff.rs, 15% relayed calls)."
observed_on = "near-sandbox 2.13.4 (near-workspaces 0.23.0), one shard; upstream scripts/build.sh wasm of 57b3f02 (pool_contract sha256 e6383aab...97e2ea, pool_executor b92f1469...634e83), rustc 1.98.1, 2026-11-14; SH-1: near-tests/run.sh all on the same build at 5cf571e, 2026-11-14"
status = "in-progress"

[assumptions.ASM-PRIVATE]
statement = "#[private] <=> predecessor = current account"
level = "high"
checked_by = ["RT-PRIVATE", "SH-2", "SH-3", "EX-8"]
source = ["https://docs.rs/near-sdk/5.29.1/near_sdk/", "spec:13", "api:9", "api:20"]
observed = "RT-PRIVATE: pool.new fails 'Method new is private' for the owner, the actor, an unrelated account and the executor, and through the relay when signed with the pool's own key; exec.new the same; a second new fails 'The contract has already been initialized'; on_result fails 'Method on_result is private' for four foreign callers and the relay; the executor's on_settled fails 'Method on_settled is private' for the owner, the actor, an unrelated account, the lock and the relay. On the deployment account's own key, on_result is now Ok with outcome 'unknown' (no promise result; an Active record stays Active, storage unchanged; id 999 logs error NotFound) and on_settled fails 'not a settle callback'; storage unchanged in every case. Every failure carries its message (SB-1 / NT-F1 fixed)."
observed_on = "near-sandbox 2.13.4 (near-workspaces 0.23.0), one shard; upstream scripts/build.sh wasm of 57b3f02 (pool_contract sha256 e6383aab...97e2ea, pool_executor b92f1469...634e83), rustc 1.98.1, 2026-11-14"
status = "in-progress"

[assumptions.ASM-CALLBACK]
statement = "The callback sees the executor's return or PromiseError"
level = "high"
checked_by = ["RT-CALLBACK", "SH-3"]
source = ["https://nomicon.io/RuntimeSpec/Components/BindingsSpec/PromisesAPI.html", "https://docs.rs/near-sdk/5.29.1/near_sdk/", "api:40"]
observed = "RT-CALLBACK: 'active' -> Active, reservation kept; 'cancelled' -> Cancelled, released exactly; 'unknown' -> Unknown; execute panics -> Unknown, the dispatch transaction succeeds and the reservation is kept; a non-string result (the number 5, or a 70-byte string from status) -> Unknown (NT-F4 fixed, upstream's hand-assembled executor). The executor's on_settled runs after the lock's settle in every finish and confirm_not_executed."
observed_on = "near-sandbox 2.13.4 (near-workspaces 0.23.0), one shard; upstream scripts/build.sh wasm of 57b3f02 (pool_contract sha256 e6383aab...97e2ea, pool_executor b92f1469...634e83), rustc 1.98.1, 2026-11-14"
status = "in-progress"

[assumptions.ASM-ATOMIC]
statement = "A panicking receipt writes nothing"
level = "high"
checked_by = ["RT-REVERT", "RES-1"]
source = ["https://nomicon.io/RuntimeSpec/Receipts.html", "https://nomicon.io/RuntimeSpec/Actions.html"]
observed = "RT-REVERT: ten core errors (Unauthorized, NotFound and InvalidState on dispatch and settle; Unauthorized and Pending on cancel; Unauthorized on set_paused; Pending on observe), Paused on dispatch, Bounds on observe (three inputs), InvalidState on cancel of a Completed record, the 1-yocto reconcile, and Arithmetic at VERSION_CAP (patched) for set_paused, observe and dispatch: each panics with its message, the pool's raw storage is byte-identical and no event is emitted. RES-1: 84 out-of-gas attempts at the maximum-size state (dispatch 40-69 Tgas, reconcile 40-45, confirm_not_executed 40-54, finish 40-54 at 256 jobs and 40-55 at 512) each fail 'Exceeded the prepaid gas.' in the first receipt, run no later receipt, log nothing, and leave both contracts' raw storage byte-identical."
observed_on = "near-sandbox 2.13.4 (near-workspaces 0.23.0), one shard; upstream scripts/build.sh wasm of 57b3f02 (pool_contract sha256 e6383aab...97e2ea, pool_executor b92f1469...634e83), rustc 1.98.1, 2026-11-14"
status = "in-progress"

[assumptions.ASM-INTERLEAVE]
statement = "Receipts can run between dispatch and on_result; ack and settle are independent model steps"
level = "med"
checked_by = ["RT-RACE"]
source = ["https://nomicon.io/RuntimeSpec/Scenarios/CrossContractCall.html", "https://nomicon.io/RuntimeSpec/Receipts.html"]
observed = "RT-RACE (one shard): a settle sent from inside execute always lands before the dispatch callback and the late 'active' ack is a no-op (version +2, not +3), for settle(true) and settle(false); the executor key's settle 0-400 ms after dispatch produced every serial order the core allows, the late-ack order included (3 of 6); the operator's finish cannot overtake the callback on one shard (8 finish-before-execute, 8 callback-first in 16 attempts). Multiple shards and congestion are not tested."
observed_on = "near-sandbox 2.13.4 (near-workspaces 0.23.0), one shard; upstream scripts/build.sh wasm of 57b3f02 (pool_contract sha256 e6383aab...97e2ea, pool_executor b92f1469...634e83), rustc 1.98.1, 2026-11-14"
status = "in-progress"

# Untested: TLA+ and Lean allow any block time per call (a superset of
# monotone time); MC-1 assumes it, and so does LIVE-2, which cites MC-1.
[assumptions.ASM-TIME]
statement = "The block timestamp is monotone"
level = "high"
checked_by = []
source = ["https://nomicon.io/RuntimeSpec/Components/BindingsSpec/ContextAPI.html", "https://nomicon.io/ChainSpec/BlockProcessing.html"]
status = "unverified"

