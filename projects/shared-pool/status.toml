  # NT-F4 (fixed by 1d441c5): on_result parses the raw promise result; one
  # that is not a single JSON string of at most 64 bytes is Unknown.
  SH-3 = { id = "SH-3", status = "in-progress", layer = "unit", evidence = "test", cross = ["difftest"], harness = "near-tests/tests/shell.rs sh3_on_result_is_private, sh3_on_result_maps_the_status_string, sh3_non_string_promise_results_become_unknown (NT-F4 fixed: 16 raw-result cases), sh9_pruned_ids_are_not_found_and_pages_are_by_id (NotFound event); tests/store_diff.rs, tests/traces.rs; mutants s01, s03, s04, s08, s14, s23, s24, s25, s00a", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = ["ASM-PRIVATE", "ASM-CALLBACK", "ASM-EXEC"], closes = ["NT-F4"], description = "on_result is private; one JSON string result of at most 64 bytes is mapped as documented, and anything else (failed, missing, two results, not a string) is Unknown; an unknown or pruned id is logged with NotFound and changes nothing" }
  SH-4 = { id = "SH-4", status = "in-progress", layer = "unit", evidence = "test", cross = ["difftest"], harness = "near-tests/tests/shell.rs sh4_rejected_submit_returns_the_decision_and_writes_nothing, sh5_core_errors_are_panics_with_the_error_string (crafted allowed-but-failing submit); tests/store_diff.rs, tests/traces.rs; mutant s13", depends_on = ["crates/contract/src/lib.rs", "crates/core/src/lib.rs", "Cargo.lock"], assumptions = [], description = "submit = core preview then submit; a rejected submit writes nothing" }
