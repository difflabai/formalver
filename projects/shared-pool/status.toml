  INV-WF = { id = "INV-WF", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-WF (InvMC in MC_Safety.cfg, Inv on every TraceCheck state); lean: Inv.lean reach_inv; prolog: verification/props.pl via tests/test_mc1.pl (MC-1) and tests/test_mc2.pl (MC-2); kani: kani/src (not landed)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-OWNER", "ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "Values have length n and are bounded; records[j].id = j; recipe in range; 1 <= units <= max_units; at most 256 records; config never changes" }
  INV-LEDGER = { id = "INV-LEDGER", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-LEDGER (InvMC, TraceCheck); lean: Inv.lean reach_inv; prolog: verification/props.pl via tests/test_mc1.pl and tests/test_mc2.pl; kani: kani/src (not landed)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-EXEC", "ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "values = base + sum of reservations of records since k0 not Cancelled + sum of completions of Completed records since k0" }
  INV-HARD = { id = "INV-HARD", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-HARD (InvMC, TraceCheck); lean: Inv.lean reach_inv; prolog: verification/props.pl via tests/test_mc1.pl and tests/test_mc2.pl; kani: kani/src (not landed)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "The envelope over the open records is computable and EV_i <= B_i" }
  INV-HEALTHY = { id = "INV-HEALTHY", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-HEALTHY (in InvMC, checked by MC_Safety and the MC_Liveness configs; TraceCheck checks Inv, which omits it); lean: Live.lean healthy; prolog: verification/props.pl via tests/test_mc1.pl and tests/test_mc2.pl; kani: kani/src (not landed)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "B = 0 => every subset of open completions lands in bounds" }
  INV-DEP = { id = "INV-DEP", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-DEP (InvMC, TraceCheck); lean: Inv.lean reach_inv; prolog: verification/props.pl via tests/test_mc1.pl and tests/test_mc2.pl; kani: kani/src (not landed)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "Every record's prerequisites are met by Completed records of lower index" }
  INV-VER = { id = "INV-VER", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-VER (InvMC, TraceCheck); lean: Inv.lean reach_inv; prolog: tests/test_mc2.pl (MC-2, per edge; MC-1's visited key drops the version); kani: kani/src (not landed)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "The version equals the number of effective transitions" }

