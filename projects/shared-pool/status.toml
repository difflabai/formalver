observed_on = "near-tests/wasm-surface.sh (near-tests/run.sh surface, within run.sh all at 5cf571e) on upstream scripts/build.sh's wasm of 57b3f02 (pool_contract sha256 e6383aab...97e2ea, pool_executor b92f1469...634e83), rustc 1.98.1, 2026-11-14"
