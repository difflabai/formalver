suites miss it. Reads mutant d02 (the core's preview allows a Paused request, generator rebuilt by prolog/run.sh) stops the generator: preview and submit disagree on 4,872 requests. Testing, not proof. Not covered: other states and requests, terms_before/terms_after, a version near u32::MAX", observed_on = "conformance generator and Scryer Prolog 0.10.0 on a4bb5c3; reads.txt sha256 5545add5...59325ef; 2026-11-12", depends_on = ["crates/core/src/lib.rs", "crates/contract/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "preview.allowed <=> candidate Ok; allowed and version < u32::MAX => submit Ok; no mutation, no panic" }
  RD-BEST = { id = "RD-BEST", status = "in-progress", layer = "kani", evidence = "bounded-proof", cross = ["prolog"], harness = "kani: h_best with h_preview, h_step_submit_tx, h_step_submit_post and h_energy: a composition (kani/RESULTS.md deviation 24); prolog: tests/test_reads.pl via verification/reads.pl (COV-2 differential: the real core's best_quantity in conformance/traces/reads.txt against the model's best_quantity/4) and tests/test_model.pl best_quantity against brute force on small cases (model)", kani_bound = "h_best: the step configuration with no record, any submit request of the step domain with units <= 7, candidate stubbed by a free Ok or Err per quantity and energy by a free result per call; the min(units, 100) cap and the real candidate and energy (units <= 3) plain mode only", kani_run = "CI kani job: h_best; local record: h_preview, h_step_submit_tx, h_step_submit_post, h_energy", observed = "COV-2: the same 36,797 requests: 0 divergences between the real core's best_quantity and the model's. 5,739 some, 31,058 none; by the generator's brute force over preview, 1,617 requests have an energy tie among the allowed units (both take the larger), 545 have a best that is not the largest allowed units, and 1,732 have a best for units above MAX_UNITS. Reads mutant d01 (prolog/mutants/reads, run by prolog/run.sh: the core's ties broken to the smaller units, generator rebuilt) changes those 1,617 lines and test_reads reports 1,617 divergences; model mutants m18 (same edit) and m20 (request version ignored, 637 divergences) are caught, m20 by test_reads only. Testing, not proof. Not covered: other states and requests", observed_on = "conformance generator and Scryer Prolog 0.10.0 on a4bb5c3; reads.txt sha256 5545add5...59325ef; 2026-11-12", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-MODEL", "ASM-TOOLS", "ASM-SPEC"], description = "best_quantity is sound and minimal as documented" }

