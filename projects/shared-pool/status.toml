# ---------------------------------------------------------------------------
# strategy.md section 5.4: invariants. Section 5 lists tla first, so TLC is
# primary: each invariant on its own INVARIANT line of every MC cfg
# (MC_Safety, MC_Cap, MC_Recovery, MC_F2b) and Inv on every TraceCheck
# state of the 216 traces; these rows are in-progress on the v1.1.0 runs.
# Kani is a cross layer here; its v1.1.0 result is pending (v1.0.0:
# INV-WF to INV-DEP by induction over states with at most 3 records,
# INV-VER along 2-operation traces from Pool::new, `kani_bound`). Inv
# omits INV-HEALTHY (it enumerates outcome combinations), so TraceCheck
# does not check that one. Lean proves the conjunction Inv (with INV-RES,
# INV-VERCAP, WIN-1 and WIN-2) at every size (inv_init, inv_step,
# reach_inv) and INV-HEALTHY as Live.lean healthy; Prolog checks each
# invariant on MC-1's seven universes and the real core's trace states.
# ---------------------------------------------------------------------------
[modules.invariants]
source = "crates/core/src/lib.rs"
tla_model = "tla/Props.tla"
lean_model = "lean/PoolLean/Inv.lean"
prolog_requirements = "prolog/verification/props.pl"

  [modules.invariants.properties]
  INV-WF = { id = "INV-WF", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-WF (InvWF in every MC cfg: MC_Safety 435,342 distinct views, MC_Cap, MC_Recovery, MC_F2b; Inv on every TraceCheck state, 216 traces; mutant t38); lean: Inv.lean reach_inv (WF, with WIN-1 and WIN-2); prolog: verification/props.pl, checked on every MC-1 state and edge (seven universes) and every MC-2 call (216 traces); tests/test_model.pl; kani: h_step_<op>_inv (2 records), h_step_<op>_inv_0, _inv_1 and _inv_3 (7 kinds each), h_init_inv, h_init_inv_2 (the induction); h_bmc_from_init_po, h_bmc_from_init_s_<op> (2-operation traces from Pool::new)", kani_bound = "induction over the step shape and domains: INV in the initial pool (shapes 1/1/2 and 2/2/2) and preserved, with the ghost update, by every step of every kind from INV states with exactly 0, 1, 2 and 3 records, so in every state reachable from Pool::new with at most 3 records; 4 or more records not covered; values Anchored(4), deltas -3..3", kani_run = "CI kani job: h_step_<op>_inv (dispatch, ack, pause, observe), h_step_<op>_inv_0 (dispatch, ack, cancel, settle, pause, observe), h_step_<op>_inv_1 (dispatch, ack, cancel, pause, observe), h_step_<op>_inv_3 (dispatch, ack, pause), h_init_inv, h_init_inv_2; local record: h_step_<op>_inv (submit, cancel, settle), h_step_submit_inv_0, h_step_submit_inv_1, h_step_settle_inv_1, h_step_<op>_inv_3 (submit, cancel, settle, observe), h_bmc_from_init_po, h_bmc_from_init_s_<op> (7)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-OWNER", "ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "Values have length n and are bounded; records[k].id = first_id + k (WIN-1); recipe in range; 1 <= units <= max_units; at most 256 records; one completed_units entry per recipe; config never changes" }
  INV-LEDGER = { id = "INV-LEDGER", status = "in-progress", layer = "tla", evidence = "model-check", cross = ["lean", "kani", "prolog"], harness = "tla: Props.tla INV-LEDGER (InvLedger in every MC cfg, TraceCheck; mutant t36); lean: Inv.lean reach_inv; prolog: verification/props.pl, checked on every MC-1 state and edge (seven universes) and every MC-2 call (216 traces); tests/test_model.pl; mutant m31; kani: h_step_<op>_inv (2 records), h_step_<op>_inv_0, _inv_1 and _inv_3 (7 kinds each), h_init_inv, h_init_inv_2 (the induction); h_bmc_from_init_po, h_bmc_from_init_s_<op> (2-operation traces from Pool::new)", kani_bound = "induction over the step shape and domains: INV in the initial pool (shapes 1/1/2 and 2/2/2) and preserved, with the ghost update, by every step of every kind from INV states with exactly 0, 1, 2 and 3 records, so in every state reachable from Pool::new with at most 3 records; 4 or more records not covered; values Anchored(4), deltas -3..3", kani_run = "CI kani job: h_step_<op>_inv (dispatch, ack, pause, observe), h_step_<op>_inv_0 (dispatch, ack, cancel, settle, pause, observe), h_step_<op>_inv_1 (dispatch, ack, cancel, pause, observe), h_step_<op>_inv_3 (dispatch, ack, pause), h_init_inv, h_init_inv_2; local record: h_step_<op>_inv (submit, cancel, settle), h_step_submit_inv_0, h_step_submit_inv_1, h_step_settle_inv_1, h_step_<op>_inv_3 (submit, cancel, settle, observe), h_bmc_from_init_po, h_bmc_from_init_s_<op> (7)", depends_on = ["crates/core/src/lib.rs"], assumptions = ["ASM-EXEC", "ASM-MODEL", "ASM-LEAN-TLA", "ASM-TOOLS", "ASM-SPEC"], description = "values = base + sum of reservations of records with id >= k0 not Cancelled + sum of completions of Completed records with id >= k0, over every issued record (pruned ones through the ghost summary)" }
