# shared-pool runtime layer (near-approval strategy.md section 9 pattern):
# near-workspaces tests of the real pool_contract.wasm and pool_executor.wasm
# (built from the pinned source mirror by scripts/build-wasm.sh) in a local
# near-sandbox. Tags: RT-PRED, RT-PRIVATE, RT-CALLBACK, RT-REVERT, RT-RACE,
# RT-WEDGE, RT-WINDOW, RT-D1, SB-1, RES-1.
#
# Standalone workspace (no parent). The lockfile was seeded from
# ../source-mirror/Cargo.lock (upstream's crates/sandbox resolves
# near-workspaces 0.23.0 there); Cargo added the missing entries once, and
# every build uses --locked. scripts/check-lock.py fails on any package that
# is in both lockfiles with a different version, source or checksum.
[workspace]
members = [".", "relay"]
resolver = "2"

[package]
name = "shared-pool-sandbox"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sandbox tests (RT-PRED, RT-PRIVATE, RT-CALLBACK, RT-REVERT, RT-RACE, RT-WEDGE, RT-WINDOW, RT-D1, SB-1, RES-1) for shared-pool"

[dependencies]

[dev-dependencies]
# Exactly upstream crates/sandbox's pins, so the near-sandbox binary is the same.
near-workspaces = { version = "=0.23.0", default-features = false, features = ["install"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
sha2 = "0.10"
# Host-side oracle: the real core. serde as upstream's sandbox crate; borsh
# (the contract's state encoding) for the RT-REVERT version-cap state, which
# is patched in because it takes about 2^32 transitions to reach, and to read
# the executor's `newest` (RT-WINDOW, RT-D1, RES-1).
pool-core = { path = "../source-mirror/crates/core", features = ["serde", "borsh"] }
borsh = { version = "1", features = ["derive"] }

# The relay helper contract (relay/) is built for wasm32 by scripts/build-res.sh
# with this profile (the mirror's release profile).
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
