\* PROP: TLA-EXEC (EX-6, EX-7, EX-8)
\* Executor.tla with WINDOW = MAX_RECORDS = 2 (real 256) and MAX_JOBS =
\* 2 * WINDOW = 4 (real 512). The lock issues ids 0 .. 5; the
\* operator names ids 0 .. 6. See Executor.tla for the universe and the VIEW;
\* ViewRefused keeps the ghost refused for InvConfSettles.
CONSTANTS
    W = 2
    MaxJobs = 4
    NIds = 6
    MaxId = 6

SPECIFICATION Spec
VIEW ViewRefused
INVARIANT TypeOK
INVARIANT InvJobCap
INVARIANT InvJobWindow
INVARIANT InvNewest
INVARIANT InvRetainedJob
INVARIANT InvVouch
INVARIANT InvLemmaJ
INVARIANT InvConfSettles
INVARIANT InvCapShape
PROPERTY StepExec
CHECK_DEADLOCK FALSE
