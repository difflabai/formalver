\* PROP: WIN-LIVE
\* A Full window is eventually not Full, under weak fairness
\* of resolving its oldest record (ResolveFront). MaxRecords = 1, so every
\* open record fills the window; every observation (disturbing ones too);
\* Pool::new at VersionCap - 4. v1.0.0: a full window stayed Full forever
\* (no prune) and the F-1 wedge kept its record open.
CONSTANTS
    Accounts = {"o", "a1", "x1", "z"}
    Times = {0, 1}
    ExpOffsets = {1, 2}
    MaxRecords = 1
    MaxVersion = 2147483647
    DoneCap = 1
    H = 4
    LCfg <- MCConfig
    Observations <- AllObservations

SPECIFICATION WinSpec
\* InvCapMC (Props.tla), one invariant per line so that TLC names the one that fails.
INVARIANT InvWF
INVARIANT InvLedger
INVARIANT InvRes
INVARIANT InvHard
INVARIANT InvDep
INVARIANT InvVer
INVARIANT InvVerCap
INVARIANT InvWinVer
INVARIANT Term1
INVARIANT LiveAll
INVARIANT Live1
INVARIANT NoWedge
INVARIANT WinEsc
INVARIANT Win2
INVARIANT RefreshAlways
INVARIANT InvOutcomes
PROPERTY WinLive
CHECK_DEADLOCK FALSE
