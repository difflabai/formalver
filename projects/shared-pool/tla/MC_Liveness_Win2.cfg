\* PROP: WIN-LIVE
\* MC_Liveness_Win.cfg at MaxRecords = 2: a Full window (two records, the
\* oldest open) is eventually not Full, under weak fairness of resolving
\* its oldest record (ResolveFront); every observation (disturbing ones
\* too); Pool::new at VersionCap - 4.
CONSTANTS
    Accounts = {"o", "a1", "x1", "z"}
    Times = {0, 1}
    ExpOffsets = {1, 2}
    MaxRecords = 2
    MaxVersion = 2147483647
    DoneCap = 1
    H = 4
    LCfg <- MCConfig
    Observations <- AllObservations

SPECIFICATION WinSpec
\* InvCapMC (Props.tla), one invariant per line so that TLC names the one that fails.
INVARIANT InvWF
INVARIANT InvLedger
INVARIANT InvRes
INVARIANT InvHard
INVARIANT InvDep
INVARIANT InvVer
INVARIANT InvVerCap
INVARIANT InvWinVer
INVARIANT Term1
INVARIANT LiveAll
INVARIANT Live1
INVARIANT NoWedge
INVARIANT WinEsc
INVARIANT Win2
INVARIANT RefreshAlways
INVARIANT InvOutcomes
PROPERTY WinLive
CHECK_DEADLOCK FALSE
