\* PROP: TLA-EXEC (EX-6, EX-7, EX-8)
\* Executor.tla with WINDOW = MAX_RECORDS = 3 (real 256) and MAX_JOBS =
\* 2 * WINDOW = 6 (real 512). The lock issues ids 0 .. 4; the
\* operator names ids 0 .. 6. See Executor.tla for the universe and the VIEW;
\* InvConfSettles (ghost refused, ViewRefused) runs at W = 2 only.
CONSTANTS
    W = 3
    MaxJobs = 6
    NIds = 5
    MaxId = 6

SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT InvJobCap
INVARIANT InvJobWindow
INVARIANT InvNewest
INVARIANT InvRetainedJob
INVARIANT InvVouch
INVARIANT InvLemmaJ
INVARIANT InvCapShape
PROPERTY StepExec
CHECK_DEADLOCK FALSE
