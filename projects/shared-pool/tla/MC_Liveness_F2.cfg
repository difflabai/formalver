\* PROP: TLA-LIVE-F2
\* Finding F-2 (healthy-state release wedge) fixed: only
\* in-bounds observes, the executor weakly fair to reporting nonexecution
\* (settle(false)) and callers weakly fair to cancelling Reserved records:
\* LIVE-2 holds (v1.0.0: violated by the F-2 wedge). Universe
\* CreditHedgeConfig (MCCommon), MaxRecords 2, Pool::new at VersionCap - 4.
CONSTANTS
    Accounts = {"o", "a1", "x1", "z"}
    Times = {0, 1}
    ExpOffsets = {1, 2}
    MaxRecords = 2
    MaxVersion = 2147483647
    DoneCap = 1
    H = 4
    LCfg <- CreditHedgeConfig
    Observations <- CreditHedgeObservations

SPECIFICATION F2Spec
\* InvCapMC (Props.tla), one invariant per line so that TLC names the one that fails.
INVARIANT InvWF
INVARIANT InvLedger
INVARIANT InvRes
INVARIANT InvHard
INVARIANT InvDep
INVARIANT InvVer
INVARIANT InvVerCap
INVARIANT InvWinVer
INVARIANT Term1
INVARIANT LiveAll
INVARIANT Live1
INVARIANT NoWedge
INVARIANT WinEsc
INVARIANT Win2
INVARIANT RefreshAlways
INVARIANT InvOutcomes
PROPERTY Live2
CHECK_DEADLOCK FALSE
