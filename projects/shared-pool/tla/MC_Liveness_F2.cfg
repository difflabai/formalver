\* PROP: TLA-LIVE-F2
\* Finding F-2 (healthy-state release wedge): only
\* in-bounds observes (B = 0 throughout, so F-1 cannot occur), the executor
\* weakly fair to reporting nonexecution (settle(false)) and callers weakly
\* fair to cancelling Reserved records: LIVE-2 must FAIL. Universe
\* CreditHedgeConfig (MCCommon), MaxRecords 2, submit/pause/observe while
\* version < 4.
CONSTANTS
    Accounts = {"o", "a1", "x1", "z"}
    Times = {0, 1}
    ExpOffsets = {1, 2}
    MaxRecords = 2
    MaxVersion = 2147483647
    VB = 4
    LCfg <- CreditHedgeConfig
    Observations <- CreditHedgeObservations

SPECIFICATION F2Spec
INVARIANT InvMC
PROPERTY Live2
CHECK_DEADLOCK FALSE
