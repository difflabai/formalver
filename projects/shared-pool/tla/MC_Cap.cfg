\* PROP: TLA-CAP
\* The version cap: Pool::new at VersionCap - 4 (VersionCap =
\* MaxVersion - 3 * MaxRecords = 2^31 - 7), MCConfig, every observation.
\* Every invariant, including the absolute ones (InvCapMC: INV-VERCAP,
\* WIN-1), and StepProperty (VER-CAP); the runner also checks that
\* Witness_AtCap and WitStep_ResolveAtCap are reachable here.
CONSTANTS
    Accounts = {"o", "a1", "x1", "z"}
    Times = {0, 1, 2}
    ExpOffsets = {0, 1, 2, 86400, 86401}
    Observations <- AllObservations
    MaxRecords = 2
    MaxVersion = 2147483647
    DoneCap = 1
    H = 4
    LCfg <- MCConfig

SPECIFICATION CapSpec
\* InvCapMC (Props.tla), one invariant per line so that TLC names the one that fails.
INVARIANT InvWF
INVARIANT InvLedger
INVARIANT InvRes
INVARIANT InvHard
INVARIANT InvDep
INVARIANT InvVer
INVARIANT InvVerCap
INVARIANT InvWinVer
INVARIANT Term1
INVARIANT LiveAll
INVARIANT Live1
INVARIANT NoWedge
INVARIANT WinEsc
INVARIANT Win2
INVARIANT RefreshAlways
INVARIANT InvOutcomes
PROPERTY StepProperty
CHECK_DEADLOCK FALSE
