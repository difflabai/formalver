\* PROP: TLA-LIVE-1
\* LIVE-2 on the completion path: the executor is weakly
\* fair to COMPLETING each record (SettleDone), observes stay in bounds.
\* Says nothing about nonexecution reports (that is TLA-LIVE-F2).
\* Scaled: MaxRecords = 2 (real 256); submit/pause/observe while version < 4.
CONSTANTS
    Accounts = {"o", "a1", "x1", "z"}
    Times = {0, 1}
    ExpOffsets = {1, 2}
    MaxRecords = 2
    MaxVersion = 2147483647
    VB = 4
    LCfg <- MCConfig
    Observations <- HealthyObservations

SPECIFICATION LiveSpec
INVARIANT InvMC
PROPERTY Live2
CHECK_DEADLOCK FALSE
