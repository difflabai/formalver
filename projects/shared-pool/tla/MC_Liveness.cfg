\* PROP: TLA-LIVE-1
\* LIVE-2 on the completion path: the executor is weakly
\* fair to COMPLETING each record (SettleDone), observes stay in bounds.
\* Scaled: MaxRecords = 2 (real 256); Pool::new at VersionCap - 4, so at
\* most 4 submit/dispatch/pause/observe calls take effect.
CONSTANTS
    Accounts = {"o", "a1", "x1", "z"}
    Times = {0, 1}
    ExpOffsets = {1, 2}
    MaxRecords = 2
    MaxVersion = 2147483647
    DoneCap = 1
    H = 4
    LCfg <- MCConfig
    Observations <- HealthyObservations

SPECIFICATION LiveSpec
\* InvCapMC (Props.tla), one invariant per line so that TLC names the one that fails.
INVARIANT InvWF
INVARIANT InvLedger
INVARIANT InvRes
INVARIANT InvHard
INVARIANT InvDep
INVARIANT InvVer
INVARIANT InvVerCap
INVARIANT InvWinVer
INVARIANT Term1
INVARIANT LiveAll
INVARIANT Live1
INVARIANT NoWedge
INVARIANT WinEsc
INVARIANT Win2
INVARIANT RefreshAlways
INVARIANT InvOutcomes
PROPERTY Live2
CHECK_DEADLOCK FALSE
