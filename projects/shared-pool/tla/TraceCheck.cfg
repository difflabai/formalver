\* REF-5: replay every conformance trace of the real core. The traces use
\* the accounts o, a1, a2, x1, x2, z and the real MAX_RECORDS. Times,
\* ExpOffsets and Observations are Next's argument domains, unused here.
\* MaxVersion: u32::MAX does not fit TLC's integers; 2^31 - 1 (no trace
\* version exceeds 18).
CONSTANTS
    Accounts = {"o", "a1", "a2", "x1", "x2", "z"}
    Times = {0}
    ExpOffsets = {1}
    Observations = {}
    MaxRecords = 256
    MaxVersion = 2147483647

SPECIFICATION TSpec
INVARIANT Inv
PROPERTY StepProperty
PROPERTY Done
CHECK_DEADLOCK TRUE
