\* REF-5: replay every conformance trace of the real core. The traces use
\* the accounts o, a1, a2, x1, x2, z and the real MAX_RECORDS (trace 207
\* fills the window and prunes). Times, ExpOffsets and Observations are
\* Next's argument domains, unused here. MaxVersion and DoneCap: u32::MAX
\* does not fit TLC's integers; 2^31 - 1 (no trace version exceeds 518, no
\* completed_units entry comes near). VersionCap is then 2^31 - 769, which
\* no trace reaches (the cap exits are in reads.txt, not core.txt).
CONSTANTS
    Accounts = {"o", "a1", "a2", "x1", "x2", "z"}
    Times = {0}
    ExpOffsets = {1}
    Observations = {}
    MaxRecords = 256
    MaxVersion = 2147483647
    DoneCap = 2147483647

SPECIFICATION TSpec
INVARIANT TInv
PROPERTY StepProperty
PROPERTY Done
CHECK_DEADLOCK TRUE
